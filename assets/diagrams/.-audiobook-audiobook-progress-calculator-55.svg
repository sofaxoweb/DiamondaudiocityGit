<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"><title>Completed or Remaining? Same 37.5%</title><rect x="0" y="0" width="800" height="450" fill="#ffffff"/><text x="24" y="42" font-size="20" font-weight="700" fill="#212529">Completed or Remaining? Same 37.5%</text>
<text x="400" y="70" font-size="14" fill="#6c757d" text-anchor="middle">12-hour audiobook</text>
<rect x="50" y="110" width="290" height="150" rx="10" fill="#e7f1ff" stroke="#adb5bd" stroke-width="2"/>
<text x="195" y="140" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Option A — completed</text>
<text x="195" y="180" font-size="16" fill="#212529" text-anchor="middle">Enter: 4 h 30 m listened</text>
<text x="195" y="222" font-size="16" font-weight="700" fill="#0d6efd" text-anchor="middle">4.5 ÷ 12 = 37.5%</text>
<rect x="460" y="110" width="290" height="150" rx="10" fill="#fff3cd" stroke="#adb5bd" stroke-width="2"/>
<text x="605" y="140" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Option B — remaining</text>
<text x="605" y="180" font-size="16" fill="#212529" text-anchor="middle">Enter: 7 h 30 m left</text>
<text x="605" y="222" font-size="16" font-weight="700" fill="#0d6efd" text-anchor="middle">(12 − 7.5) ÷ 12 = 37.5%</text>
<line x1="195" y1="260" x2="330" y2="330" stroke="#212529" stroke-width="2.5"/>
<line x1="605" y1="260" x2="470" y2="330" stroke="#212529" stroke-width="2.5"/>
<polygon points="330,323 348,338 326,344" fill="#212529"/>
<polygon points="470,323 452,338 474,344" fill="#212529"/>
<rect x="270" y="330" width="260" height="70" rx="35" fill="#198754"/>
<text x="400" y="373" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">→ 37.5% complete</text>
</svg>