<text x="400" y="380" font-size="14" fill="#6c757d" text-anchor="middle">ms per beat = 60,000 ÷ 128 = 468.75 ms · one 4/4 bar = 1,875 ms</text>
<text x="400" y="408" font-size="14" fill="#6c757d" text-anchor="middle">Set delay times to these values to lock echoes to the grid.</text>
