<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"><title>BPM, Time &amp; Beats: Fix Any Two</title><rect x="0" y="0" width="800" height="450" fill="#ffffff"/><text x="24" y="42" font-size="20" font-weight="700" fill="#212529">BPM, Time &amp; Beats: Fix Any Two</text>
<rect x="340" y="66" width="120" height="56" rx="12" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2.5"/>
<text x="400.0" y="102" font-size="17" font-weight="700" fill="#212529" text-anchor="middle">BPM</text>
<rect x="80" y="300" width="170" height="56" rx="12" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2.5"/>
<text x="165.0" y="336" font-size="17" font-weight="700" fill="#212529" text-anchor="middle">Time (seconds)</text>
<rect x="550" y="300" width="170" height="56" rx="12" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2.5"/>
<text x="635.0" y="336" font-size="17" font-weight="700" fill="#212529" text-anchor="middle">Beats</text>
<line x1="360" y1="122" x2="185" y2="300" stroke="#adb5bd" stroke-width="2.5"/>
<line x1="440" y1="122" x2="615" y2="300" stroke="#adb5bd" stroke-width="2.5"/>
<line x1="250" y1="328" x2="550" y2="328" stroke="#adb5bd" stroke-width="2.5"/>
<text x="272" y="222" font-size="14" font-weight="600" fill="#212529" text-anchor="middle" transform="rotate(-42.6 272 222)">BPM = beats × 60 ÷ seconds</text>
<text x="528" y="222" font-size="14" font-weight="600" fill="#212529" text-anchor="middle" transform="rotate(42.6 528 222)">seconds = beats × 60 ÷ BPM</text>
<text x="400" y="356" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">beats = BPM × seconds ÷ 60</text>
<rect x="220" y="388" width="360" height="46" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
<text x="400" y="417" font-size="15" fill="#212529" text-anchor="middle">e.g. 120 BPM × 15 s ÷ 60 = 30 beats</text>
</svg>