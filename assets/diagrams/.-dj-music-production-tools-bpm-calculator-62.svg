<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"><title>Beatmatching Two Decks with Pitch %</title><rect x="0" y="0" width="800" height="450" fill="#ffffff"/><text x="24" y="42" font-size="20" font-weight="700" fill="#212529">Beatmatching Two Decks with Pitch %</text>
<defs><marker id="arr62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/></marker></defs>
<circle cx="210" cy="225" r="88" fill="#f8f9fa" stroke="#343a40" stroke-width="3"/>
<circle cx="210" cy="225" r="30" fill="#ffffff" stroke="#343a40" stroke-width="2"/>
<circle cx="210" cy="225" r="5" fill="#343a40"/>
