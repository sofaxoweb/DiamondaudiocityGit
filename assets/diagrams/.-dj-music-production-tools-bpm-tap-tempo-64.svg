<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"><title>Tap Intervals → Rolling Average → BPM</title><rect x="0" y="0" width="800" height="450" fill="#ffffff"/><text x="24" y="42" font-size="20" font-weight="700" fill="#212529">Tap Intervals → Rolling Average → BPM</text>
<defs><marker id="arr64" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker></defs>
<line x1="80" y1="210" x2="560" y2="210" stroke="#adb5bd" stroke-width="2"/>
<line x1="80.0" y1="180" x2="80.0" y2="240" stroke="#0d6efd" stroke-width="4"/>
<circle cx="80.0" cy="172" r="9" fill="#0d6efd"/>
<text x="80.0" y="262" font-size="12" fill="#6c757d" text-anchor="middle">0 ms</text>
<line x1="240.0" y1="180" x2="240.0" y2="240" stroke="#0d6efd" stroke-width="4"/>
<circle cx="240.0" cy="172" r="9" fill="#0d6efd"/>
<text x="240.0" y="262" font-size="12" fill="#6c757d" text-anchor="middle">500 ms</text>
<line x1="398.4" y1="180" x2="398.4" y2="240" stroke="#0d6efd" stroke-width="4"/>
<circle cx="398.4" cy="172" r="9" fill="#0d6efd"/>
<text x="398.4" y="262" font-size="12" fill="#6c757d" text-anchor="middle">995 ms</text>
<line x1="560.0" y1="180" x2="560.0" y2="240" stroke="#0d6efd" stroke-width="4"/>
<circle cx="560.0" cy="172" r="9" fill="#0d6efd"/>
<text x="560.0" y="262" font-size="12" fill="#6c757d" text-anchor="middle">1500 ms</text>
<text x="160.0" y="150" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">500 ms</text>
<text x="319.2" y="150" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">495 ms</text>
<text x="479.2" y="150" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">505 ms</text>
<text x="320" y="110" font-size="14" fill="#6c757d" text-anchor="middle">four taps, three intervals</text>
<line x1="560" y1="210" x2="600" y2="210" stroke="#212529" stroke-width="2.5" marker-end="url(#arr64)"/>
<rect x="604" y="160" width="172" height="100" rx="10" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2"/>
<text x="690" y="192" font-size="14" fill="#6c757d" text-anchor="middle">rolling average</text>
<text x="690" y="222" font-size="19" font-weight="700" fill="#212529" text-anchor="middle">500 ms</text>
<line x1="690" y1="260" x2="690" y2="296" stroke="#212529" stroke-width="2.5" marker-end="url(#arr64)"/>
<rect x="590" y="300" width="200" height="96" rx="10" fill="#198754"/>
<text x="690" y="332" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">BPM = 60,000 ÷ 500</text>
<text x="690" y="362" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">= 120 BPM</text>
<text x="320" y="420" font-size="14" fill="#6c757d" text-anchor="middle">More taps smooth out timing wobble — outliers hurt less.</text>
</svg>