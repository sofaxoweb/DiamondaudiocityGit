<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"><title>Tap-to-Verify: Locking the Exact Tempo</title><rect x="0" y="0" width="800" height="450" fill="#ffffff"/><text x="24" y="42" font-size="20" font-weight="700" fill="#212529">Tap-to-Verify: Locking the Exact Tempo</text>
<defs><marker id="arr65" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker></defs>
<rect x="60" y="170" width="190" height="130" rx="10" fill="#e7f1ff" stroke="#adb5bd" stroke-width="2"/>
<text x="155" y="208" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">1 · Tap tempo</text>
<text x="155" y="240" font-size="14" fill="#212529" text-anchor="middle">rough estimate</text>
<text x="155" y="268" font-size="13" fill="#6c757d" text-anchor="middle">get in the ballpark</text>
<rect x="305" y="170" width="190" height="130" rx="10" fill="#fff3cd" stroke="#adb5bd" stroke-width="2"/>
<text x="400" y="208" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">2 · 32-beat count</text>
<text x="400" y="240" font-size="14" fill="#212529" text-anchor="middle">time it, calculate</text>
<text x="400" y="268" font-size="13" fill="#6c757d" text-anchor="middle">BPM = beats × 60 ÷ s</text>
<rect x="550" y="170" width="190" height="130" rx="10" fill="#d1e7dd" stroke="#adb5bd" stroke-width="2"/>
<text x="645" y="208" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">3 · DAW check</text>
<text x="645" y="240" font-size="14" fill="#212529" text-anchor="middle">set tempo, verify</text>
<text x="645" y="268" font-size="13" fill="#6c757d" text-anchor="middle">against the metronome</text>
<line x1="250" y1="235" x2="299" y2="235" stroke="#212529" stroke-width="3" marker-end="url(#arr65)"/>
<line x1="495" y1="235" x2="544" y2="235" stroke="#212529" stroke-width="3" marker-end="url(#arr65)"/>
<text x="400" y="360" font-size="14" fill="#6c757d" text-anchor="middle">Tap gets you close · counting 32 beats gets you exact · the metronome proves it.</text>
</svg>