<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="bold" fill="#212529">One Tempo Change, Three Views</text>
<rect x="40" y="170" width="140" height="100" rx="8" fill="#f8f9fa" stroke="#198754" stroke-width="1.5"/>
<text x="110" y="215" font-size="17" font-weight="bold" fill="#212529" text-anchor="middle">100 BPM</text>
<text x="110" y="240" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="middle">original</text>
<rect x="620" y="170" width="140" height="100" rx="8" fill="#f8f9fa" stroke="#198754" stroke-width="1.5"/>
<text x="690" y="215" font-size="17" font-weight="bold" fill="#212529" text-anchor="middle">120 BPM</text>
<text x="690" y="240" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="middle">new tempo</text>
<line x1="185" y1="150" x2="615" y2="150" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="615,150 605,145 605,155" fill="#0d6efd"/>
<text x="400" y="140" font-size="15" font-weight="bold" fill="#0d6efd" text-anchor="middle">× 1.20  multiplier</text>
<line x1="185" y1="215" x2="615" y2="215" stroke="#198754" stroke-width="2.5"/>
<polygon points="615,215 605,210 605,220" fill="#198754"/>
<text x="400" y="205" font-size="15" font-weight="bold" fill="#198754" text-anchor="middle">+20%  pitch</text>
<line x1="185" y1="280" x2="615" y2="280" stroke="#b8860b" stroke-width="2.5"/>
<polygon points="615,280 605,275 605,285" fill="#b8860b"/>
<text x="400" y="270" font-size="15" font-weight="bold" fill="#b8860b" text-anchor="middle">+3.16  semitones</text>
<text x="400" y="350" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="middle">Semitones = 12 × log₂(1.20) ≈ 3.16 — the same move, three different readouts.</text>
</svg>