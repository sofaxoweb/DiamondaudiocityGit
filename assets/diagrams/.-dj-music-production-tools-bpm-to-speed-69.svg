<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="bold" fill="#212529">Key Lock: Pitch Stability vs. Artifacts</text>
<text x="128" y="105" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">Pitch fader at +12%</text>
<rect x="120" y="140" width="16" height="240" rx="8" fill="#e9ecef"/>
<line x1="112" y1="140" x2="144" y2="140" stroke="#6c757d" stroke-width="1.5"/>
<text x="150" y="145" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="start">+20%</text>
<line x1="112" y1="260" x2="144" y2="260" stroke="#6c757d" stroke-width="1.5"/>
<text x="150" y="265" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="start">0%</text>
<line x1="112" y1="380" x2="144" y2="380" stroke="#6c757d" stroke-width="1.5"/>
<text x="150" y="385" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="start">−20%</text>
<rect x="104" y="107" width="48" height="18" rx="4" fill="#0d6efd"/>
<text x="128" y="121" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">+12%</text>
<line x1="170" y1="116" x2="265" y2="116" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="265,116 255,111 255,121" fill="#0d6efd"/>
<line x1="170" y1="260" x2="265" y2="260" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="265,260 255,255 255,265" fill="#0d6efd"/>
<rect x="270" y="110" width="500" height="130" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<text x="290" y="140" font-size="15" font-weight="bold" fill="#212529" text-anchor="start">Key lock ON</text>
<text x="290" y="166" font-size="14" font-weight="normal" fill="#212529" text-anchor="start">Pitch stays at the original key</text>
<text x="290" y="192" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="start">Waveform slightly smeared — time-stretch artifacts</text>
