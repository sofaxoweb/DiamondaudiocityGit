<rect x="270" y="260" width="500" height="130" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<text x="290" y="290" font-size="15" font-weight="bold" fill="#212529" text-anchor="start">Key lock OFF</text>
<text x="290" y="316" font-size="14" font-weight="normal" fill="#212529" text-anchor="start">Pitch rises ≈ 2 semitones (12 × log₂ 1.12)</text>
<text x="290" y="342" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="start">Waveform clean — resampled, no stretch artifacts</text>
