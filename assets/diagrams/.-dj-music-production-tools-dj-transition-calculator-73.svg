<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="bold" fill="#212529">Phrase-Aligned Blending</text>
<text x="24" y="66" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="start">64 bars at 128 BPM = 120 s · one bar = 1.875 s · 16 bars = 30 s</text>
<rect x="230.0" y="150" width="340.0" height="110" fill="#198754" opacity="0.18"/>
<rect x="230.0" y="150" width="340.0" height="110" fill="none" stroke="#198754" stroke-width="2" stroke-dasharray="8 5"/>
<text x="400.0" y="205" font-size="15" font-weight="bold" fill="#198754" text-anchor="middle">32-bar blend = 60 s</text>
<line x1="60.0" y1="140" x2="60.0" y2="270" stroke="#212529" stroke-width="2"/>
<text x="60.0" y="292" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">0 bars</text>
<text x="60.0" y="312" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="middle">0 s</text>
<line x1="230.0" y1="140" x2="230.0" y2="270" stroke="#212529" stroke-width="2"/>
<text x="230.0" y="292" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">16 bars</text>
<text x="230.0" y="312" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="middle">30 s</text>
<line x1="400.0" y1="140" x2="400.0" y2="270" stroke="#212529" stroke-width="2"/>
<text x="400.0" y="292" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">32 bars</text>
<text x="400.0" y="312" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="middle">60 s</text>
<line x1="570.0" y1="140" x2="570.0" y2="270" stroke="#212529" stroke-width="2"/>
<text x="570.0" y="292" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">48 bars</text>
<text x="570.0" y="312" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="middle">90 s</text>
<line x1="740.0" y1="140" x2="740.0" y2="270" stroke="#212529" stroke-width="2"/>
<text x="740.0" y="292" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">64 bars</text>
<text x="740.0" y="312" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="middle">120 s</text>
<line x1="60" y1="260" x2="740" y2="260" stroke="#adb5bd" stroke-width="1"/>
<text x="400" y="370" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="middle">Start and end every transition on a 16-bar boundary — phrases resolve cleanly.</text>
</svg>