<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="bold" fill="#212529">Swing in Milliseconds (100 BPM)</text>
<text x="24" y="66" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="start">At 100 BPM a 16th note = 150 ms.</text>
<text x="24" y="140" font-size="14" font-weight="bold" fill="#212529" text-anchor="start">Straight 16ths</text>
<circle cx="60.0" cy="170" r="9" fill="#0d6efd"/>
<circle cx="230.0" cy="170" r="9" fill="#0d6efd"/>
<circle cx="400.0" cy="170" r="9" fill="#0d6efd"/>
<circle cx="570.0" cy="170" r="9" fill="#0d6efd"/>
<circle cx="740.0" cy="170" r="9" fill="#0d6efd"/>
<line x1="60.0" y1="170" x2="740.0" y2="170" stroke="#0d6efd" stroke-width="1.5"/>
<text x="145.0" y="160" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">150 ms</text>
<text x="315.0" y="160" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">150 ms</text>
<text x="485.0" y="160" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">150 ms</text>
<text x="655.0" y="160" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">150 ms</text>
<text x="400" y="210" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="middle">even 150 ms spacing</text>
<text x="24" y="280" font-size="14" font-weight="bold" fill="#212529" text-anchor="start">62% swung 16ths</text>
<line x1="60.0" y1="310" x2="740.0" y2="310" stroke="#adb5bd" stroke-width="1.5"/>
<circle cx="60.0" cy="310" r="9" fill="#198754"/>
<circle cx="400.0" cy="310" r="9" fill="#198754"/>
<circle cx="740.0" cy="310" r="9" fill="#198754"/>
<circle cx="270.8" cy="310" r="9" fill="#dc3545"/>
<circle cx="610.8" cy="310" r="9" fill="#dc3545"/>
<text x="165.4" y="300" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">186 ms</text>
<text x="335.4" y="300" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">114 ms</text>
<text x="270.8" y="348" font-size="13" font-weight="bold" fill="#dc3545" text-anchor="middle">+36 ms late</text>
<text x="610.8" y="348" font-size="13" font-weight="bold" fill="#dc3545" text-anchor="middle">+36 ms late</text>
<text x="400" y="400" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="middle">62% swing delays each off-beat 16th by 36 ms — that delay IS the feel.</text>
</svg>