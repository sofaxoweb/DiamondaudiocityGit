<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="bold" fill="#212529">Microtiming: Same Grid, Different Feel</text>
<text x="24" y="142" font-size="14" font-weight="bold" fill="#212529" text-anchor="start">25 ms early — pushing · urgent</text>
<line x1="60" y1="170" x2="740" y2="170" stroke="#e9ecef" stroke-width="1.5"/>
<line x1="400" y1="140" x2="400" y2="200" stroke="#212529" stroke-width="2.5"/>
<text x="400" y="218" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">beat grid</text>
<circle cx="275" cy="170" r="11" fill="#dc3545"/>
<text x="275" y="175" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
<text x="740" y="142" font-size="13" font-weight="bold" fill="#dc3545" text-anchor="end">-25 ms</text>
<text x="24" y="232" font-size="14" font-weight="bold" fill="#212529" text-anchor="start">On the grid — locked</text>
<line x1="60" y1="260" x2="740" y2="260" stroke="#e9ecef" stroke-width="1.5"/>
<line x1="400" y1="230" x2="400" y2="290" stroke="#212529" stroke-width="2.5"/>
<text x="400" y="308" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">beat grid</text>
<circle cx="400" cy="260" r="11" fill="#198754"/>
<text x="400" y="265" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
<text x="740" y="232" font-size="13" font-weight="bold" fill="#198754" text-anchor="end">+0 ms</text>
<text x="24" y="322" font-size="14" font-weight="bold" fill="#212529" text-anchor="start">25 ms late — laid-back · relaxed</text>
<line x1="60" y1="350" x2="740" y2="350" stroke="#e9ecef" stroke-width="1.5"/>
<line x1="400" y1="320" x2="400" y2="380" stroke="#212529" stroke-width="2.5"/>
<text x="400" y="398" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">beat grid</text>
<circle cx="525" cy="350" r="11" fill="#0d6efd"/>
<text x="525" y="355" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
<text x="740" y="322" font-size="13" font-weight="bold" fill="#0d6efd" text-anchor="end">+25 ms</text>
<text x="400" y="430" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="middle">Identical BPM — the feel changes in milliseconds.</text>
</svg>