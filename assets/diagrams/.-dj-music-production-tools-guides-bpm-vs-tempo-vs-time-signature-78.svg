<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="bold" fill="#212529">Same BPM, Different Bar Lengths</text>
<text x="24" y="66" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="start">Beat spacing is identical (0.5 s) — time signature only groups the beats.</text>
<text x="24" y="162" font-size="14" font-weight="bold" fill="#212529" text-anchor="start">4/4 at 120 BPM</text>
<line x1="60" y1="180" x2="60" y2="120" stroke="#212529" stroke-width="2.5"/>
<text x="100.0" y="110" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">0.5 s</text>
<line x1="140" y1="180" x2="140" y2="136" stroke="#212529" stroke-width="2.5"/>
<text x="180.0" y="126" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">0.5 s</text>
<line x1="220" y1="180" x2="220" y2="136" stroke="#212529" stroke-width="2.5"/>
<text x="260.0" y="126" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">0.5 s</text>
<line x1="300" y1="180" x2="300" y2="136" stroke="#212529" stroke-width="2.5"/>
<text x="340.0" y="126" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">0.5 s</text>
<line x1="380" y1="180" x2="380" y2="136" stroke="#212529" stroke-width="2.5"/>
<line x1="60" y1="180" x2="380" y2="180" stroke="#adb5bd" stroke-width="1.5"/>
<text x="392" y="160" font-size="14" font-weight="bold" fill="#0d6efd" text-anchor="start">1 bar = 2.0 s</text>
<text x="24" y="312" font-size="14" font-weight="bold" fill="#212529" text-anchor="start">3/4 at 120 BPM</text>
<line x1="60" y1="330" x2="60" y2="270" stroke="#212529" stroke-width="2.5"/>
<text x="100.0" y="260" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">0.5 s</text>
<line x1="140" y1="330" x2="140" y2="286" stroke="#212529" stroke-width="2.5"/>
<text x="180.0" y="276" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">0.5 s</text>
<line x1="220" y1="330" x2="220" y2="286" stroke="#212529" stroke-width="2.5"/>
<text x="260.0" y="276" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="middle">0.5 s</text>
<line x1="300" y1="330" x2="300" y2="286" stroke="#212529" stroke-width="2.5"/>
<line x1="60" y1="330" x2="300" y2="330" stroke="#adb5bd" stroke-width="1.5"/>
<text x="312" y="310" font-size="14" font-weight="bold" fill="#0d6efd" text-anchor="start">1 bar = 1.5 s</text>
<text x="400" y="410" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="middle">4 beats × 0.5 s = 2.0 s  ·  3 beats × 0.5 s = 1.5 s</text>
</svg>