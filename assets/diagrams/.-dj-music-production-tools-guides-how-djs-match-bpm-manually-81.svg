<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="bold" fill="#212529">Manual Beatmatching in Five Steps</text>
<rect x="16" y="140" width="140" height="150" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<circle cx="40" cy="172" r="14" fill="#0d6efd"/>
<text x="40" y="177" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="60" y="178" font-size="13" font-weight="bold" fill="#212529" text-anchor="start">Know live BPM</text>
<text x="30" y="210" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="start">Read the playing deck</text>
<line x1="156" y1="215" x2="172" y2="215" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="172,215 162,210 162,220" fill="#0d6efd"/>
<rect x="172" y="140" width="140" height="150" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<circle cx="196" cy="172" r="14" fill="#0d6efd"/>
<text x="196" y="177" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="216" y="178" font-size="13" font-weight="bold" fill="#212529" text-anchor="start">Tap incoming BPM</text>
<text x="186" y="210" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="start">Use the Tap Tempo tool</text>
<line x1="312" y1="215" x2="328" y2="215" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="328,215 318,210 318,220" fill="#0d6efd"/>
<rect x="328" y="140" width="140" height="150" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<circle cx="352" cy="172" r="14" fill="#0d6efd"/>
<text x="352" y="177" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="372" y="178" font-size="13" font-weight="bold" fill="#212529" text-anchor="start">Set fader %</text>
<text x="342" y="210" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="start">Match the percent</text>
<line x1="468" y1="215" x2="484" y2="215" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="484,215 474,210 474,220" fill="#0d6efd"/>
<rect x="484" y="140" width="140" height="150" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<circle cx="508" cy="172" r="14" fill="#0d6efd"/>
<text x="508" y="177" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="528" y="178" font-size="13" font-weight="bold" fill="#212529" text-anchor="start">Cue on the one</text>
<text x="498" y="210" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="start">Drop on beat 1</text>
<line x1="624" y1="215" x2="640" y2="215" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="640,215 630,210 630,220" fill="#0d6efd"/>
<rect x="640" y="140" width="140" height="150" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<circle cx="664" cy="172" r="14" fill="#0d6efd"/>
<text x="664" y="177" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="684" y="178" font-size="13" font-weight="bold" fill="#212529" text-anchor="start">Listen, nudge,</text>
<text x="654" y="210" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="start">Ride the pitch</text>
<text x="400" y="350" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="middle">Repeat step 5 until the two kicks stay locked — that is beatmatching.</text>
</svg>