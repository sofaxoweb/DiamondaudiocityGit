<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="bold" fill="#212529">Fader Percent → New BPM</text>
<text x="140" y="100" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">Pitch fader</text>
<rect x="132" y="120" width="16" height="240" rx="8" fill="#e9ecef"/>
<line x1="124" y1="120" x2="156" y2="120" stroke="#6c757d" stroke-width="1.5"/>
<text x="164" y="125" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="start">+8%</text>
<line x1="124" y1="240" x2="156" y2="240" stroke="#6c757d" stroke-width="1.5"/>
<text x="164" y="245" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="start">+0%</text>
<line x1="124" y1="360" x2="156" y2="360" stroke="#6c757d" stroke-width="1.5"/>
<text x="164" y="365" font-size="12" font-weight="normal" fill="#6c757d" text-anchor="start">-8%</text>
<rect x="116" y="183.0" width="48" height="18" rx="4" fill="#0d6efd"/>
<text x="140" y="197.0" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">+3.2%</text>
<line x1="190" y1="197" x2="240" y2="197" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="240,197 230,192 230,202" fill="#0d6efd"/>
<rect x="240" y="147" width="130" height="100" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<text x="305" y="190" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">124 BPM</text>
<rect x="390" y="147" width="120" height="100" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<text x="450" y="190" font-size="16" font-weight="bold" fill="#0d6efd" text-anchor="middle">× 1.032</text>
<rect x="530" y="147" width="170" height="100" rx="8" fill="#f8f9fa" stroke="#198754" stroke-width="1.5"/>
<text x="615" y="190" font-size="16" font-weight="bold" fill="#198754" text-anchor="middle">≈ 128 BPM</text>
<text x="400" y="330" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="middle">124 × 1.032 = 127.97 ≈ 128 — the same percent works at any tempo: 100 → 103.2 · 140 → 144.5</text>
</svg>