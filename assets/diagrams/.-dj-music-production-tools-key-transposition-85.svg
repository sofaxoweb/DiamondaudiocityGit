<text x="475.0" y="121.0961894323342" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">C♯</text>
<circle cx="529.9" cy="170.0" r="24" fill="#f8f9fa" stroke="#212529" stroke-width="1"/>
<text x="529.9038105676658" y="176.0" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">D</text>
