<text x="550.0" y="251.0" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">D♯</text>
<circle cx="529.9" cy="320.0" r="24" fill="#f8f9fa" stroke="#212529" stroke-width="1"/>
