<text x="400.0" y="401.0" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">F♯</text>
<circle cx="325.0" cy="374.9" r="24" fill="#0d6efd" stroke="#212529" stroke-width="1"/>
