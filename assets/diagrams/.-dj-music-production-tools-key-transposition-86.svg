<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="bold" fill="#212529">One Concert Key, Three Written Parts</text>
<line x1="60" y1="150" x2="220" y2="150" stroke="#212529" stroke-width="1.2"/>
<line x1="60" y1="162" x2="220" y2="162" stroke="#212529" stroke-width="1.2"/>
<line x1="60" y1="174" x2="220" y2="174" stroke="#212529" stroke-width="1.2"/>
<line x1="60" y1="186" x2="220" y2="186" stroke="#212529" stroke-width="1.2"/>
<line x1="60" y1="198" x2="220" y2="198" stroke="#212529" stroke-width="1.2"/>
<ellipse cx="140" cy="186" rx="12" ry="8" fill="#212529" transform="rotate(-20 140 186)"/>
<line x1="150" y1="186" x2="150" y2="130" stroke="#212529" stroke-width="2"/>
<text x="100" y="190" font-size="22" font-weight="normal" fill="#212529" text-anchor="start">♭</text>
<text x="140" y="130" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">Concert pitch: B♭</text>
<line x1="230" y1="175" x2="300" y2="165" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="300,165 290,160 290,170" fill="#0d6efd"/>
<rect x="300" y="120" width="230" height="90" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<text x="320" y="152" font-size="14" font-weight="bold" fill="#212529" text-anchor="start">Trumpet (B♭)</text>
<text x="320" y="178" font-size="15" font-weight="bold" fill="#0d6efd" text-anchor="start">written: C</text>
<text x="500" y="178" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="end">+2 semitones</text>
<line x1="230" y1="175" x2="300" y2="270" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="300,270 290,265 290,275" fill="#0d6efd"/>
<rect x="300" y="225" width="230" height="90" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<text x="320" y="257" font-size="14" font-weight="bold" fill="#212529" text-anchor="start">Alto sax (E♭)</text>
<text x="320" y="283" font-size="15" font-weight="bold" fill="#0d6efd" text-anchor="start">written: G</text>
<text x="500" y="283" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="end">+9 semitones</text>
<line x1="230" y1="175" x2="300" y2="375" stroke="#0d6efd" stroke-width="2.5"/>
<polygon points="300,375 290,370 290,380" fill="#0d6efd"/>
<rect x="300" y="330" width="230" height="90" rx="8" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
<text x="320" y="362" font-size="14" font-weight="bold" fill="#212529" text-anchor="start">Horn (F)</text>
<text x="320" y="388" font-size="15" font-weight="bold" fill="#0d6efd" text-anchor="start">written: F</text>
<text x="500" y="388" font-size="13" font-weight="normal" fill="#6c757d" text-anchor="end">+7 semitones</text>
<text x="545" y="425" font-size="14" font-weight="normal" fill="#6c757d" text-anchor="middle">Written pitch = concert pitch + instrument offset.</text>
</svg>