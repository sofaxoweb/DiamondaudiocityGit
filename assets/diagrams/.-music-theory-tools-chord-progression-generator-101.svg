<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Circular diagram of functional harmony showing the tonic subdominant dominant tonic flow with C-major examples" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="20" y="38" font-size="20" font-weight="bold" fill="#212529">Functional harmony: the T → S → D → T loop</text><defs><marker id="ah101" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#212529"/></marker></defs><rect x="305" y="56.0" width="190" height="88" rx="12" fill="#ffffff" stroke="#198754" stroke-width="3"/><text x="400.0" y="86.0" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">Tonic</text><text x="400.0" y="110.0" font-size="14" fill="#198754" text-anchor="middle" font-weight="bold">I · vi</text><text x="400.0" y="132.0" font-size="13" fill="#6c757d" text-anchor="middle">C · Am</text><rect x="418" y="251.0" width="190" height="88" rx="12" fill="#ffffff" stroke="#0d6efd" stroke-width="3"/><text x="512.5833024919771" y="281.0" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">Subdominant</text><text x="512.5833024919771" y="305.0" font-size="14" fill="#0d6efd" text-anchor="middle" font-weight="bold">IV · ii</text><text x="512.5833024919771" y="327.0" font-size="13" fill="#6c757d" text-anchor="middle">F · Dm</text><rect x="192" y="251.0" width="190" height="88" rx="12" fill="#ffffff" stroke="#dc3545" stroke-width="3"/><text x="287.41669750802293" y="281.0" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">Dominant</text><text x="287.41669750802293" y="305.0" font-size="14" fill="#dc3545" text-anchor="middle" font-weight="bold">V · vii°</text><text x="287.41669750802293" y="327.0" font-size="13" fill="#6c757d" text-anchor="middle">G · Bdim</text><path d="M 480 128 A 130 130 0 0 1 529 212" fill="none" stroke="#212529" stroke-width="2.5" marker-end="url(#ah101)"/><path d="M 449 351 A 130 130 0 0 1 351 351" fill="none" stroke="#212529" stroke-width="2.5" marker-end="url(#ah101)"/><path d="M 271 212 A 130 130 0 0 1 320 128" fill="none" stroke="#212529" stroke-width="2.5" marker-end="url(#ah101)"/><text x="400" y="222" font-size="13" fill="#6c757d" text-anchor="middle">tension</text><text x="400" y="242" font-size="13" fill="#6c757d" text-anchor="middle">builds →</text><text x="400" y="262" font-size="13" fill="#6c757d" text-anchor="middle">resolution</text><rect x="20" y="386" width="760" height="44" rx="8" fill="#f8f9fa" stroke="#dee2e6"/><text x="40" y="414" font-size="14" fill="#212529" text-anchor="start">Home (tonic) → departure (subdominant) → tension (dominant) → home again.</text></svg>