<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="The first seven harmonics of a 110 Hz fundamental as bars at integer multiples, with the 7th partial flagged about 31 cents flat" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="20" y="38" font-size="20" font-weight="bold" fill="#212529">Harmonic series on a 110 Hz fundamental</text><rect x="70" y="90" width="72" height="250" fill="#0d6efd" stroke="#212529" stroke-width="1.5"/><text x="106.0" y="362" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">110 Hz</text><text x="106.0" y="380" font-size="12" fill="#6c757d" text-anchor="middle">partial 1</text><rect x="170" y="215" width="72" height="125" fill="#0d6efd" stroke="#212529" stroke-width="1.5"/><text x="206.0" y="362" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">220 Hz</text><text x="206.0" y="380" font-size="12" fill="#6c757d" text-anchor="middle">partial 2</text><rect x="270" y="257" width="72" height="83" fill="#0d6efd" stroke="#212529" stroke-width="1.5"/><text x="306.0" y="362" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">330 Hz</text><text x="306.0" y="380" font-size="12" fill="#6c757d" text-anchor="middle">partial 3</text><rect x="370" y="278" width="72" height="62" fill="#0d6efd" stroke="#212529" stroke-width="1.5"/><text x="406.0" y="362" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">440 Hz</text><text x="406.0" y="380" font-size="12" fill="#6c757d" text-anchor="middle">partial 4</text><rect x="470" y="290" width="72" height="50" fill="#0d6efd" stroke="#212529" stroke-width="1.5"/><text x="506.0" y="362" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">550 Hz</text><text x="506.0" y="380" font-size="12" fill="#6c757d" text-anchor="middle">partial 5</text><rect x="570" y="298" width="72" height="42" fill="#0d6efd" stroke="#212529" stroke-width="1.5"/><text x="606.0" y="362" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">660 Hz</text><text x="606.0" y="380" font-size="12" fill="#6c757d" text-anchor="middle">partial 6</text><rect x="670" y="304" width="72" height="36" fill="#dc3545" stroke="#212529" stroke-width="1.5"/><text x="706.0" y="362" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">770 Hz</text><text x="706.0" y="380" font-size="12" fill="#6c757d" text-anchor="middle">partial 7</text><line x1="50" y1="340" x2="770" y2="340" stroke="#212529" stroke-width="2"/><text x="50" y="100" font-size="13" fill="#6c757d" text-anchor="start">↑ amplitude</text><rect x="420" y="52" width="330" height="86" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/><text x="435" y="78" font-size="14" fill="#212529" text-anchor="start" font-weight="bold">7th partial: 770 Hz</text><text x="435" y="100" font-size="13" fill="#212529" text-anchor="start">≈ 31¢ flat of the equal-tempered</text><text x="435" y="120" font-size="13" fill="#212529" text-anchor="start">minor 7th — sounds "out of tune"</text><text x="60" y="420" font-size="13" fill="#6c757d" text-anchor="start">Each partial is an integer multiple of the fundamental: f, 2f, 3f …</text></svg>