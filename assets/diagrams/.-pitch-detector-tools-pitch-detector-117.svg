<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">How Browser Pitch Detection Works</text>
<text x="24" y="58" font-size="14" fill="#6c757d">Signal flow from your microphone to the note readout:</text>

<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d6efd"/></marker>
</defs>

<!-- 5 boxes -->
<g text-anchor="middle">
<rect x="20" y="130" width="130" height="150" rx="10" fill="#eef4ff" stroke="#0d6efd" stroke-width="2"/>
<circle cx="85" cy="170" r="18" fill="none" stroke="#0d6efd" stroke-width="3"/><rect x="76" y="168" width="18" height="34" rx="9" fill="#0d6efd"/>
<text x="85" y="228" font-size="15" font-weight="bold" fill="#212529">Microphone</text>
<text x="85" y="250" font-size="12" fill="#6c757d">voice → digital</text>
<text x="85" y="266" font-size="12" fill="#6c757d">samples</text>

<rect x="182" y="130" width="140" height="150" rx="10" fill="#f8f9fa" stroke="#212529" stroke-width="2"/>
<polyline points="192,180 200,180 205,165 210,195 215,170 220,190 225,175 232,185 240,172 248,188 256,178 264,184 272,176 280,182 290,180 300,180" fill="none" stroke="#198754" stroke-width="2"/>
<text x="252" y="228" font-size="15" font-weight="bold" fill="#212529">2,048-sample</text>
<text x="252" y="248" font-size="15" font-weight="bold" fill="#212529">buffer</text>
<text x="252" y="268" font-size="12" fill="#6c757d">≈ 46 ms @ 44.1 kHz</text>

<rect x="354" y="130" width="140" height="150" rx="10" fill="#f8f9fa" stroke="#212529" stroke-width="2"/>
<text x="424" y="168" font-size="15" font-weight="bold" fill="#212529">Autocorrelation</text>
<text x="424" y="192" font-size="12" fill="#6c757d">slides the signal over</text>
<text x="424" y="210" font-size="12" fill="#6c757d">itself to find the period</text>
<text x="424" y="228" font-size="12" fill="#6c757d">T with the strongest</text>
<text x="424" y="246" font-size="12" fill="#6c757d">match</text>

<rect x="526" y="130" width="120" height="150" rx="10" fill="#f8f9fa" stroke="#212529" stroke-width="2"/>
<text x="586" y="180" font-size="22" font-weight="bold" fill="#212529">f₀ = 1/T</text>
<text x="586" y="210" font-size="12" fill="#6c757d">fundamental</text>
<text x="586" y="228" font-size="12" fill="#6c757d">frequency</text>
<text x="586" y="252" font-size="12" fill="#6c757d">e.g. T = 1/220 s</text>
<text x="586" y="268" font-size="12" fill="#6c757d">→ 220 Hz</text>

<rect x="668" y="130" width="112" height="150" rx="10" fill="#e6f7ee" stroke="#198754" stroke-width="2"/>
<text x="724" y="172" font-size="30" font-weight="bold" fill="#198754">A3</text>
<text x="724" y="200" font-size="13" fill="#212529">220.0 Hz</text>
<text x="724" y="222" font-size="13" fill="#212529">+4 cents</text>
<text x="724" y="250" font-size="12" fill="#6c757d">note · Hz · cents</text>
</g>

<!-- arrows -->
<line x1="150" y1="205" x2="178" y2="205" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="322" y1="205" x2="350" y2="205" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="494" y1="205" x2="522" y2="205" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="646" y1="205" x2="664" y2="205" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#arr)"/>

<rect x="24" y="320" width="752" height="100" rx="8" fill="#fff8e6"/>
<text x="40" y="348" font-size="14" fill="#212529"><tspan font-weight="bold">Why 2,048 samples?</tspan> A longer buffer hears lower notes more reliably, but adds latency —</text>
<text x="40" y="370" font-size="14" fill="#212529">2,048 samples is the standard trade-off: ~46 ms of audio, fast enough to feel live.</text>
<text x="40" y="396" font-size="14" fill="#6c757d">Autocorrelation compares the waveform against delayed copies of itself; the delay with the best match is one period.</text>
</svg>
