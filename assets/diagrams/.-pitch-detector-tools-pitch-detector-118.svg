<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">The Octave Error: A Strong 2nd Harmonic</text>

<!-- Panel A -->
<text x="24" y="70" font-size="15" font-weight="bold" fill="#198754">A. True signal — 220 Hz fundamental</text>
<polyline points="80,200.0 90,180.5 100,164.8 110,156.1 120,156.1 130,164.8 140,180.5 150,200.0 160,219.5 170,235.2 180,243.9 190,243.9 200,235.2 210,219.5 220,200.0 230,180.5 240,164.8 250,156.1 260,156.1 270,164.8 280,180.5 290,200.0 300,219.5 310,235.2 320,243.9 330,243.9 340,235.2 350,219.5 360,200.0" fill="none" stroke="#198754" stroke-width="2.5"/>
<line x1="80" y1="130" x2="220" y2="130" stroke="#6c757d" stroke-width="1.5"/>
<line x1="80" y1="124" x2="80" y2="136" stroke="#6c757d" stroke-width="1.5"/><line x1="220" y1="124" x2="220" y2="136" stroke="#6c757d" stroke-width="1.5"/>
<text x="150" y="122" font-size="13" fill="#6c757d" text-anchor="middle">one period T = 1/220 s</text>
<text x="420" y="170" font-size="14" fill="#212529">Detector should read</text>
<text x="420" y="194" font-size="16" font-weight="bold" fill="#198754">220 Hz = A3</text>

<!-- Panel B -->
<text x="24" y="300" font-size="15" font-weight="bold" fill="#dc3545">B. With a strong 2nd harmonic — autocorrelation locks on T/2</text>
<polyline points="80,375.0 90,340.9 100,325.2 110,334.0 120,357.5 130,377.9 140,383.1 150,375.0 160,366.9 170,372.1 180,392.5 190,416.0 200,424.8 210,409.1 220,375.0 230,340.9 240,325.2 250,334.0 260,357.5 270,377.9 280,383.1 290,375.0 300,366.9 310,372.1 320,392.5 330,416.0 340,424.8 350,409.1 360,375.0" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<line x1="80" y1="330" x2="150" y2="330" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="80" y1="324" x2="80" y2="336" stroke="#dc3545" stroke-width="1.5"/><line x1="150" y1="324" x2="150" y2="336" stroke="#dc3545" stroke-width="1.5"/>
<text x="115" y="322" font-size="13" fill="#dc3545" text-anchor="middle">T/2 — false match</text>
<text x="420" y="360" font-size="14" fill="#212529">Detector wrongly reports</text>
<text x="420" y="384" font-size="16" font-weight="bold" fill="#dc3545">440 Hz = A4</text>
<text x="420" y="408" font-size="14" fill="#6c757d">one octave too high</text>

<text x="24" y="435" font-size="13" fill="#6c757d">The 2nd harmonic repeats twice per period, so a half-period delay also correlates strongly — classic octave-up error.</text>
</svg>
