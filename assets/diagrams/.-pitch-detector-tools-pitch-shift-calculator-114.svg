<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">Pitch Shift Moves Harmonics, Not Formants</text>

<!-- axes: freq 0-2000 Hz, x 70..740 -->
<line x1="70" y1="360" x2="740" y2="360" stroke="#212529" stroke-width="2"/>
<line x1="70" y1="360" x2="70" y2="90" stroke="#212529" stroke-width="2"/>
<text x="405" y="410" font-size="14" fill="#212529" text-anchor="middle">Frequency (Hz)</text>
<text x="30" y="225" font-size="14" fill="#212529" text-anchor="middle" transform="rotate(-90 30 225)">Amplitude</text>
<g font-size="12" fill="#6c757d" text-anchor="middle">
<text x="70" y="378">0</text><text x="203" y="378">400</text><text x="337" y="378">800</text><text x="470" y="378">1200</text><text x="603" y="378">1600</text><text x="737" y="378">2000</text>
</g>

<!-- formant envelope (fixed): smooth curve with 3 humps -->
<path d="M 70 340 C 110 335, 130 250, 203 240 C 250 235, 270 300, 320 305 C 360 308, 380 210, 470 200 C 540 193, 560 280, 620 285 C 670 288, 690 330, 740 335" fill="none" stroke="#6f42c1" stroke-width="3.5"/>

<!-- original harmonics f0=200 Hz, green -->
<g stroke="#198754" stroke-width="3">
<line x1="137" y1="360" x2="137" y2="300"/><line x1="203" y1="360" x2="203" y2="242"/><line x1="270" y1="360" x2="270" y2="285"/><line x1="337" y1="360" x2="337" y2="295"/><line x1="403" y1="360" x2="403" y2="265"/><line x1="470" y1="360" x2="470" y2="202"/><line x1="537" y1="360" x2="537" y2="270"/><line x1="603" y1="360" x2="603" y2="282"/><line x1="670" y1="360" x2="670" y2="300"/>
</g>
<!-- shifted harmonics x1.5 = 300,600,900,1200,1500,1800 blue dashed -->
<g stroke="#0d6efd" stroke-width="3" stroke-dasharray="8 5">
<line x1="170" y1="360" x2="170" y2="278"/><line x1="270" y1="360" x2="270" y2="285"/><line x1="370" y1="360" x2="370" y2="262"/><line x1="470" y1="360" x2="470" y2="202"/><line x1="570" y1="360" x2="570" y2="268"/><line x1="670" y1="360" x2="670" y2="300"/>
</g>

<!-- legend -->
<rect x="86" y="96" width="430" height="86" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
<line x1="100" y1="118" x2="140" y2="118" stroke="#198754" stroke-width="4"/><text x="148" y="122" font-size="13" fill="#212529">original harmonics (f₀ = 200 Hz)</text>
<line x1="100" y1="144" x2="140" y2="144" stroke="#0d6efd" stroke-width="4" stroke-dasharray="8 5"/><text x="148" y="148" font-size="13" fill="#212529">shifted harmonics (+7 semitones ≈ ×1.5)</text>
<line x1="100" y1="170" x2="140" y2="170" stroke="#6f42c1" stroke-width="4"/><text x="148" y="174" font-size="13" fill="#212529">formant envelope — stays fixed in place</text>

<text x="560" y="120" font-size="14" fill="#212529">Pitch moves up, but the smooth</text>
<text x="560" y="142" font-size="14" fill="#212529">formant curve does not — that is</text>
<text x="560" y="164" font-size="14" fill="#212529">why the voice keeps its identity</text>
<text x="560" y="186" font-size="14" fill="#212529">after pitch shifting.</text>
</svg>
