<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Chromatic circle showing the 12 semitone positions with the C to E shift highlighted" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="20" y="38" font-size="20" font-weight="bold" fill="#212529">Chromatic circle: transposing C → E (+4)</text><circle cx="400" cy="240" r="150" fill="none" stroke="#212529" stroke-width="2"/><circle cx="400" cy="90" r="26" fill="#0d6efd" stroke="#212529" stroke-width="2"/><text x="400" y="96" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text><text x="400" y="146" font-size="11" fill="#6c757d" text-anchor="middle">+0</text><circle cx="475" cy="110" r="26" fill="#ffffff" stroke="#212529" stroke-width="2"/><text x="475" y="116" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">D♭</text><text x="449" y="159" font-size="11" fill="#6c757d" text-anchor="middle">+1</text><circle cx="530" cy="165" r="26" fill="#ffffff" stroke="#212529" stroke-width="2"/><text x="530" y="171" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">D</text><text x="485" y="195" font-size="11" fill="#6c757d" text-anchor="middle">+2</text><circle cx="550" cy="240" r="26" fill="#ffffff" stroke="#212529" stroke-width="2"/><text x="550" y="246" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">E♭</text><text x="498" y="244" font-size="11" fill="#6c757d" text-anchor="middle">+3</text><circle cx="530" cy="315" r="26" fill="#0d6efd" stroke="#212529" stroke-width="2"/><text x="530" y="321" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">E</text><text x="485" y="293" font-size="11" fill="#6c757d" text-anchor="middle">+4</text><circle cx="475" cy="370" r="26" fill="#ffffff" stroke="#212529" stroke-width="2"/><text x="475" y="376" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">F</text><text x="449" 