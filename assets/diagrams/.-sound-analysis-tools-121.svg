<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">The Decibel Ladder (logarithmic)</text>
<text x="24" y="58" font-size="14" fill="#6c757d">Every +10 dB = 10× more sound energy. Doubling loudness feels like ≈ +10 dB.</text>

<!-- ladder: 0-120 dB, y = 400 - dB*2.833 -->
<rect x="300" y="60" width="90" height="340" fill="#f1f3f5" stroke="#212529" stroke-width="2"/>
<!-- gradient zones -->
<rect x="300" y="159" width="90" height="241" fill="#198754" opacity="0.25"/>
<rect x="300" y="88" width="90" height="71" fill="#ffc107" opacity="0.35"/>
<rect x="300" y="60" width="90" height="28" fill="#dc3545" opacity="0.35"/>

<g font-size="13" fill="#212529" text-anchor="end">
<text x="290" y="404">0 dB</text><text x="290" y="347">20</text><text x="290" y="290">40</text><text x="290" y="234">60</text><text x="290" y="177">80</text><text x="290" y="120">100</text><text x="290" y="64">120</text>
</g>
<g stroke="#212529" stroke-width="1.5">
<line x1="300" y1="400" x2="312" y2="400"/><line x1="300" y1="343" x2="312" y2="343"/><line x1="300" y1="287" x2="312" y2="287"/><line x1="300" y1="230" x2="312" y2="230"/><line x1="300" y1="173" x2="312" y2="173"/><line x1="300" y1="117" x2="312" y2="117"/><line x1="300" y1="60" x2="312" y2="60"/>
</g>

<!-- markers -->
<g font-size="14" fill="#212529">
<line x1="300" y1="315" x2="390" y2="315" stroke="#212529" stroke-width="2.5"/>
<text x="400" y="312" font-weight="bold">30 dB — whisper</text>
<text x="400" y="332" font-size="12" fill="#6c757d">quiet library</text>

<line x1="300" y1="230" x2="390" y2="230" stroke="#212529" stroke-width="2.5"/>
<text x="400" y="227" font-weight="bold">60 dB — conversation</text>
<text x="400" y="247" font-size="12" fill="#6c757d">normal talking</text>

<line x1="300" y1="159" x2="390" y2="159" stroke="#dc3545" stroke-width="3" stroke-dasharray="8 5"/>
<text x="400" y="156" font-weight="bold" fill="#dc3545">85 dBA — hearing-safety line</text>
<text x="400" y="176" font-size="12" fill="#6c757d">above this: risk of hearing damage</text>

<line x1="300" y1="88" x2="390" y2="88" stroke="#212529" stroke-width="2.5"/>
<text x="400" y="85" font-weight="bold">110 dB — rock concert</text>
<text x="400" y="105" font-size="12" fill="#6c757d">chainsaw, front row</text>
</g>

<rect x="24" y="368" width="560" height="62" rx="8" fill="#eef4ff"/>
<text x="40" y="394" font-size="14" fill="#212529">Why it matters: a whisper is not "half" a conversation —</text>
<text x="40" y="416" font-size="14" fill="#212529">30 dB less means <tspan font-weight="bold">1,000× less</tspan> sound energy (10³).</text>
</svg>
