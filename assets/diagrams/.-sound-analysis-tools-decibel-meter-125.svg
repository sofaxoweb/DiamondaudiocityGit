<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">dBFS vs dB SPL: Two Different Rulers</text>

<!-- dBFS scale: 0 top, -96 bottom; y = 80 + (-db)/96*300 -->
<text x="120" y="70" font-size="16" font-weight="bold" fill="#0d6efd" text-anchor="middle">dBFS (digital)</text>
<text x="120" y="90" font-size="12" fill="#6c757d" text-anchor="middle">what your browser measures</text>
<rect x="90" y="100" width="60" height="300" fill="#f1f3f5" stroke="#212529" stroke-width="2"/>
<rect x="90" y="100" width="60" height="30" fill="#dc3545" opacity="0.5"/>
<g font-size="13" fill="#212529" text-anchor="end">
<text x="84" y="106">0</text><text x="84" y="153">−12</text><text x="84" y="200">−24</text><text x="84" y="247">−48</text><text x="84" y="294">−72</text><text x="84" y="404">−96</text>
</g>
<text x="160" y="112" font-size="13" fill="#dc3545" font-weight="bold">← 0 dBFS = digital clipping</text>
<text x="160" y="136" font-size="13" fill="#6c757d">nothing can be louder</text>

<!-- dB SPL scale: 0 bottom, 130 top; y = 400 - db/130*300 -->
<text x="640" y="70" font-size="16" font-weight="bold" fill="#198754" text-anchor="middle">dB SPL (acoustic)</text>
<text x="640" y="90" font-size="12" fill="#6c757d" text-anchor="middle">what a sound meter measures</text>
<rect x="610" y="100" width="60" height="300" fill="#f1f3f5" stroke="#212529" stroke-width="2"/>
<g font-size="13" fill="#212529" text-anchor="start">
<text x="676" y="404">0</text><text x="676" y="335">30</text><text x="676" y="265">60</text><text x="676" y="219">85</text><text x="676" y="150">110</text><text x="676" y="104">130</text>
</g>
<text x="600" y="392" font-size="13" fill="#198754" font-weight="bold" text-anchor="end">0 dB SPL = 20 µPa →</text>
<text x="600" y="412" font-size="13" fill="#6c757d" text-anchor="end">threshold of hearing</text>

<!-- calibration bridge -->
<line x1="150" y1="250" x2="610" y2="250" stroke="#6c757d" stroke-width="2" stroke-dasharray="8 5"/>
<polygon points="610,244 622,250 610,256" fill="#6c757d"/>
<polygon points="150,244 138,250 150,256" fill="#6c757d"/>
<rect x="270" y="228" width="220" height="44" rx="8" fill="#fff8e6" stroke="#e0a800" stroke-width="2"/>
<text x="380" y="255" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">calibration bridges the two</text>

<rect x="24" y="420" width="752" height="24" fill="#ffffff"/>
<text x="24" y="438" font-size="13" fill="#6c757d">There is no fixed conversion: the same −12 dBFS reading is a whisper on laptop speakers and a roar on a PA — only calibration links them.</text>
</svg>
