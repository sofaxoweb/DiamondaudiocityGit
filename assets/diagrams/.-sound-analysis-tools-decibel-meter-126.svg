<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">OSHA vs NIOSH: Maximum Daily Noise Exposure</text>
<text x="24" y="58" font-size="14" fill="#6c757d">Log scale — each halving of allowed time is one exchange-rate step up in dB.</text>

<!-- legend -->
<rect x="60" y="72" width="18" height="14" fill="#0d6efd"/><text x="84" y="84" font-size="13" fill="#212529">OSHA (legal limit — 5 dB exchange, 90 dBA / 8 h)</text>
<rect x="440" y="72" width="18" height="14" fill="#198754"/><text x="464" y="84" font-size="13" fill="#212529">NIOSH (recommended — 3 dB exchange, 85 dBA / 8 h)</text>

<g font-size="14" fill="#212529">
<text x="60" y="140" font-weight="bold">85 dBA</text>
<text x="60" y="196" font-weight="bold">90 dBA</text>
<text x="60" y="252" font-weight="bold">95 dBA</text>
<text x="60" y="308" font-weight="bold">100 dBA</text>
</g>
<!-- bars: OSHA blue, NIOSH green -->
<g font-size="13" fill="#ffffff" font-weight="bold">
<rect x="200" y="122" width="383" height="20" fill="#0d6efd"/><text x="210" y="137">16 h</text>
<rect x="200" y="148" width="331" height="20" fill="#198754"/><text x="210" y="163">8 h</text>

<rect x="200" y="178" width="331" height="20" fill="#0d6efd"/><text x="210" y="193">8 h</text>
<rect x="200" y="204" width="243" height="20" fill="#198754"/><text x="210" y="219">2.5 h</text>

<rect x="200" y="234" width="279" height="20" fill="#0d6efd"/><text x="210" y="249">4 h</text>
<rect x="200" y="260" width="155" height="20" fill="#198754"/><text x="210" y="275">47 min</text>

<rect x="200" y="290" width="226" height="20" fill="#0d6efd"/><text x="210" y="305">2 h</text>
<rect x="200" y="316" width="69" height="20" fill="#198754"/><text x="210" y="331">15 min</text>
</g>
<g font-size="12" fill="#6c757d">
<text x="590" y="137">OSHA</text><text x="538" y="163">NIOSH</text>
<text x="538" y="193">OSHA</text><text x="450" y="219">NIOSH</text>
<text x="486" y="249">OSHA</text><text x="362" y="275">NIOSH</text>
<text x="433" y="305">OSHA</text><text x="276" y="331">NIOSH</text>
</g>

<rect x="24" y="360" width="752" height="70" rx="8" fill="#eef4ff"/>
<text x="40" y="386" font-size="14" fill="#212529"><tspan font-weight="bold">Exchange rate:</tspan> NIOSH halves allowed time every <tspan font-weight="bold">3 dB</tspan>; OSHA halves it every <tspan font-weight="bold">5 dB</tspan>.</text>
<text x="40" y="410" font-size="14" fill="#6c757d">Rule of thumb: follow OSHA for legal compliance, follow NIOSH to actually protect your hearing.</text>
</svg>
