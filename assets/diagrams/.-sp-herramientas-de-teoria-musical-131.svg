<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">Patrones de semitonos: escala mayor y menor</text>
<text x="24" y="58" font-size="14" fill="#6c757d">Desde Do: el mismo teclado de 12 semitonos, dos selecciones distintas.</text>

<!-- keyboard C-C: 7 white keys x 70..730, each 94.28, y 90..270 -->
<g text-anchor="middle">
<rect x="70" y="90" width="94.3" height="180" fill="#dce9fd" stroke="#212529" stroke-width="2"/><text x="117" y="245" font-size="15" font-weight="bold" fill="#212529">Do</text>
<rect x="164.3" y="90" width="94.3" height="180" fill="#d4f3e2" stroke="#212529" stroke-width="2"/><text x="211" y="245" font-size="15" font-weight="bold" fill="#212529">Re</text>
<rect x="258.6" y="90" width="94.3" height="180" fill="#ffffff" stroke="#212529" stroke-width="2"/><text x="306" y="245" font-size="15" font-weight="bold" fill="#212529">Mi</text>
<rect x="352.8" y="90" width="94.3" height="180" fill="#dce9fd" stroke="#212529" stroke-width="2"/><text x="400" y="245" font-size="15" font-weight="bold" fill="#212529">Fa</text>
<rect x="447.1" y="90" width="94.3" height="180" fill="#dce9fd" stroke="#212529" stroke-width="2"/><text x="494" y="245" font-size="15" font-weight="bold" fill="#212529">Sol</text>
<rect x="541.4" y="90" width="94.3" height="180" fill="#d4f3e2" stroke="#212529" stroke-width="2"/><text x="588" y="245" font-size="15" font-weight="bold" fill="#212529">La</text>
<rect x="635.7" y="90" width="94.3" height="180" fill="#ffffff" stroke="#212529" stroke-width="2"/><text x="683" y="245" font-size="15" font-weight="bold" fill="#212529">Si</text>
</g>
<!-- black keys -->
<g text-anchor="middle">
<rect x="140.6" y="90" width="52" height="110" fill="#d4f3e2" stroke="#212529" stroke-width="2"/><text x="166.6" y="180" font-size="12" font-weight="bold" fill="#212529">Mi♭</text>
<rect x="329.1" y="90" width="52" height="110" fill="#212529"/><text x="355" y="180" font-size="12" font-weight="bold" fill="#ffffff">Fa♯</text>
<rect x="423.4" y="90" width="52" height="110" fill="#d4f3e2" stroke="#212529" stroke-width="2"/><text x="449.4" y="180" font-size="12" font-weight="bold" fill="#212529">La♭</text>
<rect x="517.7" y="90" width="52" height="110" fill="#d4f3e2" stroke="#212529" stroke-width="2"/><text x="543.7" y="180" font-size="12" font-weight="bold" fill="#212529">Si♭</text>
<rect x="612" y="90" width="52" height="110" fill="#212529"/>
</g>
<text x="760" y="245" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Do</text>

<!-- major pattern 2-2-1-2-2-2-1 above -->
<g font-size="13" font-weight="bold" fill="#0d6efd" text-anchor="middle">
<text x="164" y="78">2</text><text x="258" y="78">2</text><text x="353" y="78">1</text><text x="447" y="78">2</text><text x="541" y="78">2</text><text x="635" y="78">2</text><text x="730" y="78">1</text>
</g>
<text x="24" y="310" font-size="14" fill="#0d6efd" font-weight="bold">Escala mayor: 2 – 2 – 1 – 2 – 2 – 2 – 1</text>
<text x="24" y="332" font-size="13" fill="#6c757d">Do Re Mi Fa Sol La Si Do (teclas azules) — los semitonos (1) caen entre Mi–Fa y Si–Do</text>

<!-- minor pattern 2-1-2-2-1-2-2 below -->
<g font-size="13" font-weight="bold" fill="#198754" text-anchor="middle">
<text x="164" y="292">2</text><text x="235" y="292">1</text><text x="330" y="292">2</text><text x="424" y="292">2</text><text x="494" y="292">1</text><text x="565" y="292">2</text><text x="659" y="292">2</text>
</g>
<text x="24" y="368" font-size="14" fill="#198754" font-weight="bold">Escala menor: 2 – 1 – 2 – 2 – 1 – 2 – 2</text>
<text x="24" y="390" font-size="13" fill="#6c757d">Do Re Mi♭ Fa Sol La♭ Si♭ Do (teclas verdes) — los semitonos (1) caen entre Re–Mi♭ y Sol–La♭</text>
<text x="24" y="420" font-size="13" fill="#6c757d">El patrón funciona desde cualquier nota inicial: cuenta los semitonos y obtendrás la escala.</text>
</svg>
