<text x="400" y="370" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">First axial mode:  f = c / 2L</text>
<text x="400" y="396" font-size="13.5" font-weight="400" fill="#6c757d" text-anchor="middle">c = 343 m/s (speed of sound) · L = distance between parallel walls</text>
<text x="400" y="420" font-size="13.5" font-weight="400" fill="#6c757d" text-anchor="middle">This is why bass booms at the walls and vanishes mid-room.</text>
