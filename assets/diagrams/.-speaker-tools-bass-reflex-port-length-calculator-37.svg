<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Diagram comparing smooth and turbulent airflow in speaker ports">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#212529">Port airflow: laminar vs turbulent</text>
<text x="210" y="78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#198754" text-anchor="middle" font-weight="bold">Flared port — laminar</text>
<polyline points="80.0,150.0 180.0,170.0 180.0,290.0 80.0,310.0" fill="#e9ecef" stroke="#212529" stroke-width="2"/>
<polyline points="340.0,150.0 240.0,170.0 240.0,290.0 340.0,310.0" fill="#e9ecef" stroke="#212529" stroke-width="2"/>
<line x1="90" y1="190" x2="330" y2="190" stroke="#0d6efd" stroke-width="2.5"/>
<polyline points="310.0,184.0 330.0,190.0 310.0,196.0" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
<line x1="90" y1="215" x2="330" y2="215" stroke="#0d6efd" stroke-width="2.5"/>
<polyline points="310.0,209.0 330.0,215.0 310.0,221.0" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
<line x1="90" y1="240" x2="330" y2="240" stroke="#0d6efd" stroke-width="2.5"/>
<polyline points="310.0,234.0 330.0,240.0 310.0,246.0" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
<line x1="90" y1="265" x2="330" y2="265" stroke="#0d6efd" stroke-width="2.5"/>
<polyline points="310.0,259.0 330.0,265.0 310.0,271.0" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
<text x="210" y="352" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#198754" text-anchor="middle" font-weight="bold">smooth, silent flow</text>
<text x="590" y="78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#dc3545" text-anchor="middle" font-weight="bold">Narrow straight port — turbulent</text>
<rect x="500" y="195" width="40" height="70" fill="#e9ecef" stroke="#212529" stroke-width="2"/>
<rect x="640" y="195" width="40" height="70" fill="#e9ecef" stroke="#212529" stroke-width="2"/>
<line x1="470" y1="230" x2="560" y2="230" stroke="#0d6efd" stroke-width="2.5"/>
<circle cx="590" cy="215" r="10" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<circle cx="610" cy="245" r="9" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<circle cx="625" cy="220" r="8" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<circle cx="590" cy="250" r="7" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<circle cx="618" cy="232" r="6" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<line x1="640" y1="230" x2="710" y2="230" stroke="#dc3545" stroke-width="2.5"/>
<polyline points="690.0,224.0 710.0,230.0 690.0,236.0" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<text x="590" y="352" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#dc3545" text-anchor="middle" font-weight="bold">chuffing: puffing, whistling noise</text>
<text x="400" y="400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#212529" text-anchor="middle">Turbulence starts ≈ 17 m/s (≈ 5% of 343 m/s) — flare the ends and size the port generously</text>
</svg>
