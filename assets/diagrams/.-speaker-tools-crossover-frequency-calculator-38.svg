<text x="372" y="190" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">L = 0.60 mH</text>
<line x1="424" y1="210" x2="560" y2="210" stroke="#212529" stroke-width="2.5"/>
