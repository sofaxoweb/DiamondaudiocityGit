<text x="502" y="372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">L = 0.60 mH</text>
<line x1="424" y1="350" x2="560" y2="350" stroke="#212529" stroke-width="2.5"/>
<line x1="450" y1="343" x2="450" y2="350" stroke="#212529" stroke-width="2.5"/>
<line x1="554" y1="343" x2="554" y2="350" stroke="#212529" stroke-width="2.5"/>
<circle cx="600" cy="340" r="30" fill="#ffffff" stroke="#212529" stroke-width="2.5"/>
<text x="600" y="346" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">T</text>
<line x1="630" y1="230" x2="700" y2="230" stroke="#212529" stroke-width="2.5"/>
<line x1="630" y1="340" x2="700" y2="340" stroke="#212529" stroke-width="2.5"/>
<text x="400" y="415" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#212529" text-anchor="middle">2nd-order (12 dB/oct) Butterworth: L = R√2 ÷ 2πFc · C = 1 ÷ 2πFcR√2</text>
