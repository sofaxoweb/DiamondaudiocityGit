<circle cx="600" cy="230" r="30" fill="#ffffff" stroke="#212529" stroke-width="2.5"/>
<text x="600" y="236" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">W</text>
<text x="300" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#dc3545" text-anchor="start" font-weight="bold">HIGH-PASS → tweeter</text>
<line x1="320" y1="330" x2="352" y2="330" stroke="#212529" stroke-width="2.5"/>
<line x1="352" y1="318" x2="352" y2="342" stroke="#212529" stroke-width="3"/>
<line x1="360" y1="318" x2="360" y2="342" stroke="#212529" stroke-width="3"/>
<line x1="360" y1="330" x2="424" y2="330" stroke="#212529" stroke-width="2.5"/>
<text x="372" y="322" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="start"></text>
<text x="340" y="312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">C = 4.7 µF</text>
<path d="M450,330 a13,13 0 0 1 26,0" fill="none" stroke="#212529" stroke-width="2.5"/>
<path d="M476,330 a13,13 0 0 1 26,0" fill="none" stroke="#212529" stroke-width="2.5"/>
