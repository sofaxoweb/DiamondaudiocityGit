<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Schematic diagram of a second-order passive speaker crossover">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#212529">2nd-order crossover schematic (3000 Hz, 8 Ω)</text>
<rect x="40" y="190" width="110" height="80" rx="8" fill="#ffffff" stroke="#212529" stroke-width="2"/>
<text x="95" y="226" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">AMP</text>
<text x="95" y="248" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6c757d" text-anchor="middle">Fc = 3 kHz</text>
