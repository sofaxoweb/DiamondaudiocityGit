<text x="120" y="66" font-size="13" font-weight="400" fill="#212529" text-anchor="start">1. Re ~ 6.4 Ω - DC resistance floor</text>
<text x="120" y="90" font-size="13" font-weight="400" fill="#212529" text-anchor="start">2. Fs peak (Zmax ~ 35 Ω) - driver resonance</text>
<text x="120" y="114" font-size="13" font-weight="400" fill="#212529" text-anchor="start">3. Zmin ~ 5.6 Ω - impedance dip (the 80% rule)</text>
