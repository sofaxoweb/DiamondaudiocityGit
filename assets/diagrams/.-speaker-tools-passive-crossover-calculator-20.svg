<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>Crossover Board Layout: Beat Magnetic Crosstalk</title>
<desc>Keep inductors at right angles and well separated to prevent magnetic coupling.</desc>
<rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
<text x="20" y="36" font-size="20" font-weight="700" fill="#212529">Crossover Board Layout: Beat Magnetic Crosstalk</text>
<rect x="60" y="70" width="680" height="330" rx="4" fill="#ffffff" stroke="#212529" stroke-width="2"/>
<text x="400" y="96" font-size="14" font-weight="400" fill="#6c757d" text-anchor="middle">crossover board (top view)</text>
<ellipse cx="220" cy="240" rx="34" ry="60" fill="none" stroke="#0d6efd" stroke-width="4"/>
<line x1="220" y1="180" x2="220" y2="300" stroke="#0d6efd" stroke-width="2"/>
<text x="220" y="332" font-size="13.5" font-weight="700" fill="#0d6efd" text-anchor="middle">inductor 1</text>
<ellipse cx="560" cy="240" rx="60" ry="34" fill="none" stroke="#0d6efd" stroke-width="4"/>
<line x1="500" y1="240" x2="620" y2="240" stroke="#0d6efd" stroke-width="2"/>
<text x="560" y="306" font-size="13.5" font-weight="700" fill="#0d6efd" text-anchor="middle">inductor 2</text>
<line x1="220" y1="150" x2="560" y2="150" stroke="#212529" stroke-width="1.5"/>
<line x1="220" y1="142" x2="220" y2="158" stroke="#212529" stroke-width="1.5"/>
<line x1="560" y1="142" x2="560" y2="158" stroke="#212529" stroke-width="1.5"/>
<text x="390.0" y="140" font-size="13.5" font-weight="700" fill="#212529" text-anchor="middle">10+ cm apart</text>
<rect x="180" y="160" width="20" height="20" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<text x="170" y="174" font-size="14" font-weight="700" fill="#dc3545" text-anchor="middle">90°</text>
<rect x="340" y="300" width="60" height="40" rx="8" fill="#ffffff" stroke="#198754" stroke-width="2"/>
<text x="370" y="326" font-size="12.5" font-weight="400" fill="#212529" text-anchor="middle">film cap</text>
<rect x="420" y="300" width="60" height="40" rx="8" fill="#ffffff" stroke="#198754" stroke-width="2"/>
<text x="450" y="326" font-size="12.5" font-weight="400" fill="#212529" text-anchor="middle">film cap</text>
<rect x="620" y="300" width="90" height="40" rx="8" fill="#ffffff" stroke="#dc3545" stroke-width="2"/>
<text x="665" y="318" font-size="13" font-weight="700" fill="#212529" text-anchor="middle">L-pad</text>
<text x="665" y="334" font-size="11.5" font-weight="400" fill="#dc3545" text-anchor="middle">R series + R shunt</text>
<text x="400" y="424" font-size="14" font-weight="400" fill="#6c757d" text-anchor="middle">Right angles + distance = coils ignore each other. No magnetic crosstalk.</text>
</svg>