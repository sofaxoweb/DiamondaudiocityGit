<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Anatomy of a bass reflex enclosure: box volume Vb, tuning frequency Fb, and port dimensions.">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#212529">Anatomy of a bass reflex (ported) enclosure</text>
<rect x="130" y="80" width="380" height="300" fill="#f8f9fa" stroke="#212529" stroke-width="3"/>
<circle cx="205" cy="230" r="55" fill="#ffffff" stroke="#212529" stroke-width="3"/>
<circle cx="205" cy="230" r="30" fill="none" stroke="#6c757d" stroke-width="2"/>
<circle cx="205" cy="230" r="8" fill="#6c757d"/>
<text x="205" y="330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#212529" text-anchor="middle">Driver</text>
<rect x="430" y="250" width="160" height="56" fill="#ffffff" stroke="#212529" stroke-width="3"/>
<line x1="510" y1="80" x2="510" y2="250" stroke="#212529" stroke-width="3"/>
<text x="510" y="226" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">Vb</text>
<text x="510" y="244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6c757d" text-anchor="middle">box volume</text>
<line x1="590" y1="250" x2="590" y2="306" stroke="#0d6efd" stroke-width="2.5"/>
<polyline points="585.0,258.0 590.0,250.0 595.0,258.0" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
<polyline points="585.0,298.0 590.0,306.0 595.0,298.0" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
<text x="600" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#0d6efd" text-anchor="start" font-weight="bold">D</text>
<text x="616" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="start">port diameter</text>
<line x1="430" y1="330" x2="590" y2="330" stroke="#0d6efd" stroke-width="2.5"/>
<polyline points="438.0,325.0 430.0,330.0 438.0,335.0" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
<polyline points="582.0,325.0 590.0,330.0 582.0,335.0" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
<text x="510" y="352" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#0d6efd" text-anchor="middle" font-weight="bold">Lv</text>
<text x="510" y="370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">physical port length</text>
<line x1="445" y1="278" x2="575" y2="278" stroke="#198754" stroke-width="2.5"/>
<polyline points="455.0,272.0 445.0,278.0 455.0,284.0" fill="none" stroke="#198754" stroke-width="2.5"/>
<polyline points="565.0,272.0 575.0,278.0 565.0,284.0" fill="none" stroke="#198754" stroke-width="2.5"/>
<text x="510" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="start"></text>
<text x="640" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#198754" text-anchor="start" font-weight="bold">Air mass in the port</text>
<text x="640" y="162" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#198754" text-anchor="start">oscillates at Fb</text>
<text x="640" y="184" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6c757d" text-anchor="start">(the tuning frequency)</text>
<text x="640" y="216" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#212529" text-anchor="start" font-weight="bold">Fb set by Vb, D and Lv</text>
</svg>
