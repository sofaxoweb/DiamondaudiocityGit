<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>Sound at a Wall: Absorbed, Reflected, Transmitted</title>
<desc>Incident energy splits into three paths; the absorption coefficient α sets the shares.</desc>
<rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
<text x="20" y="36" font-size="20" font-weight="700" fill="#212529">Sound at a Wall: Absorbed, Reflected, Transmitted</text>
<rect x="378" y="80" width="44" height="300" fill="#e9ecef" stroke="#212529" stroke-width="2"/>
<text x="400" y="400" font-size="14" font-weight="400" fill="#6c757d" text-anchor="middle">wall</text>
<defs><marker id="ah0d6efd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0d6efd"/></marker></defs>
<line x1="80" y1="180" x2="370" y2="180" stroke="#0d6efd" stroke-width="3" marker-end="url(#ah0d6efd)"/>
<text x="180" y="165" font-size="14" font-weight="700" fill="#0d6efd" text-anchor="middle">Incident 100%</text>
<defs><marker id="ah198754" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#198754"/></marker></defs>
<line x1="370" y1="260" x2="90" y2="260" stroke="#198754" stroke-width="3" marker-end="url(#ah198754)"/>
<text x="190" y="248" font-size="14" font-weight="700" fill="#198754" text-anchor="middle">Reflected ~70%</text>
<defs><marker id="ah6c757d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6c757d"/></marker></defs>
<line x1="430" y1="180" x2="720" y2="180" stroke="#6c757d" stroke-width="3" marker-end="url(#ah6c757d)"/>
<text x="590" y="165" font-size="14" font-weight="700" fill="#6c757d" text-anchor="middle">Transmitted</text>
<text x="590" y="186" font-size="13" font-weight="400" fill="#6c757d" text-anchor="middle">(leaks through)</text>
<path d="M386,300 q8,-8 0,-16 q-8,-8 0,-16" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<path d="M396,330 q8,-8 0,-16 q-8,-8 0,-16" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<path d="M406,360 q8,-8 0,-16 q-8,-8 0,-16" fill="none" stroke="#dc3545" stroke-width="2.5"/>
<text x="400" y="316" font-size="14" font-weight="700" fill="#dc3545" text-anchor="middle">Absorbed</text>
<text x="400" y="292" font-size="13.5" font-weight="400" fill="#dc3545" text-anchor="middle">α = 0.3 (30%)</text>
<text x="400" y="424" font-size="13.5" font-weight="400" fill="#6c757d" text-anchor="middle">α = absorbed ÷ incident  ·  α = 0.3 means 30% absorbed, 70% reflected or transmitted</text>
</svg>