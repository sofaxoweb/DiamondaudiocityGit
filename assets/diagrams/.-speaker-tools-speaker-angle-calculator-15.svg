<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>Vertical Speaker Angles (Side View)</title>
<desc>Side view: tweeter at ear height, height channels at 30 to 45 degrees elevation.</desc>
<rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
<text x="20" y="36" font-size="20" font-weight="700" fill="#212529">Vertical Speaker Angles (Side View)</text>
<line x1="60" y1="380" x2="740" y2="380" stroke="#212529" stroke-width="3"/>
<text x="66" y="402" font-size="13" font-weight="400" fill="#6c757d" text-anchor="start">floor</text>
<line x1="60" y1="80" x2="740" y2="80" stroke="#adb5bd" stroke-width="2" stroke-dasharray="8,5"/>
<text x="66" y="72" font-size="13" font-weight="400" fill="#6c757d" text-anchor="start">ceiling</text>
<circle cx="560" cy="226" r="18" fill="#198754"/>
<line x1="560" y1="244" x2="560" y2="380" stroke="#198754" stroke-width="8" stroke-linecap="round"/>
<text x="586" y="254" font-size="13" font-weight="700" fill="#198754" text-anchor="start">ear</text>
<rect x="116" y="240" width="48" height="130" fill="#212529" rx="4"/>
<circle cx="140" cy="250" r="12" fill="#0d6efd"/>
<text x="140" y="226" font-size="13" font-weight="400" fill="#6c757d" text-anchor="middle">front speaker</text>
<line x1="164" y1="250" x2="542" y2="250" stroke="#0d6efd" stroke-width="2" stroke-dasharray="8,5"/>
<text x="350" y="238" font-size="13.5" font-weight="700" fill="#0d6efd" text-anchor="middle">tweeter at ear height</text>
<polygon points="386,104 370,80 402,80" fill="#fd7e14"/>
<text x="386" y="64" font-size="13" font-weight="400" fill="#6c757d" text-anchor="middle">height speaker</text>
<line x1="560" y1="250" x2="386" y2="104" stroke="#fd7e14" stroke-width="2" stroke-dasharray="6,4"/>
<path d="M629.3,210.0 A80,80 0 0 0 616.6,193.4" fill="none" stroke="#dc3545" stroke-width="3"/>
<text x="660" y="196" font-size="14" font-weight="700" fill="#dc3545" text-anchor="middle">30-45 deg</text>
<text x="400" y="428" font-size="13.5" font-weight="400" fill="#6c757d" text-anchor="middle">Aim tweeters at ear level; place Atmos height speakers 30–45° above the listening position.</text>
</svg>