<circle cx="352" cy="215" r="20" fill="#ffffff" stroke="#212529" stroke-width="2"/>
<text x="352" y="220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">8 Ω</text>
<circle cx="394" cy="215" r="20" fill="#ffffff" stroke="#212529" stroke-width="2"/>
