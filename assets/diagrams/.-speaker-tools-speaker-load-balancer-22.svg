<text x="400" y="372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#dc3545" text-anchor="middle" font-weight="bold">8 ÷ 4 = 2 Ω</text>
<text x="400" y="396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#dc3545" text-anchor="middle">danger: below most amps&#x27; rating</text>
