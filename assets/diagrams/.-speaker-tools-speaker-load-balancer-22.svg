<text x="650" y="372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#198754" text-anchor="middle" font-weight="bold">(8+8) ∥ (8+8) = 8 Ω</text>
<text x="650" y="396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#198754" text-anchor="middle">matches the amp — full power</text>
<circle cx="745" cy="70" r="14" fill="#198754"/>
<path d="M738,70 l5,6 l9,-12" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
