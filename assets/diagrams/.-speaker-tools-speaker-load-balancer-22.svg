<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Diagram comparing total impedance for series, parallel, and series-parallel wiring of four 8-ohm speakers.">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#212529">Wiring four 8-ohm speakers: total load</text>
<text x="150" y="78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">All series</text>
<line x1="150" y1="86" x2="150" y2="352" stroke="#212529" stroke-width="3"/>
<circle cx="150" cy="130" r="20" fill="#ffffff" stroke="#212529" stroke-width="2"/>
<text x="150" y="135" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">8 Ω</text>
<circle cx="150" cy="195" r="20" fill="#ffffff" stroke="#212529" stroke-width="2"/>
<text x="150" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">8 Ω</text>
<circle cx="150" cy="260" r="20" fill="#ffffff" stroke="#212529" stroke-width="2"/>
<text x="150" y="265" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">8 Ω</text>
<circle cx="150" cy="325" r="20" fill="#ffffff" stroke="#212529" stroke-width="2"/>
<text x="150" y="330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">8 Ω</text>
<text x="162" y="104" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6c757d" text-anchor="start">from amp</text>
<text x="162" y="344" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6c757d" text-anchor="start">back to amp</text>
<text x="150" y="372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold">8+8+8+8 = 32 Ω</text>
<text x="150" y="396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6c757d" text-anchor="middle">safe but very quiet</text>
