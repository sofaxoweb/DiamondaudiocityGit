<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>Watts vs Loudness (+10 dB per 10×)</title>
<desc>Loudness grows with the log of power: ten times the watts sounds only about twice as loud.</desc>
<rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
<text x="20" y="36" font-size="20" font-weight="700" fill="#212529">Watts vs Loudness (+10 dB per 10×)</text>
