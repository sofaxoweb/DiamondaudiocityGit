<line x1="110" y1="400" x2="110" y2="100" stroke="#212529" stroke-width="2"/>
<text x="390.0" y="438" font-size="14" font-weight="400" fill="#6c757d" text-anchor="middle">Power (watts)</text>
<text x="48" y="250.0" font-size="14" font-weight="400" fill="#6c757d" text-anchor="middle" transform="rotate(-90 48 250.0)">Gain over 1 W (dB)</text>
<line x1="110" y1="400.0" x2="670" y2="400.0" stroke="#dee2e6" stroke-width="1"/>
<text x="100" y="405.0" font-size="13" font-weight="400" fill="#6c757d" text-anchor="end">+0</text>
<line x1="110" y1="306.25" x2="670" y2="306.25" stroke="#dee2e6" stroke-width="1"/>
<text x="100" y="311.25" font-size="13" font-weight="400" fill="#6c757d" text-anchor="end">+10</text>
<line x1="110" y1="212.5" x2="670" y2="212.5" stroke="#dee2e6" stroke-width="1"/>
<text x="100" y="217.5" font-size="13" font-weight="400" fill="#6c757d" text-anchor="end">+20</text>
<line x1="110" y1="118.75" x2="670" y2="118.75" stroke="#dee2e6" stroke-width="1"/>
<text x="100" y="123.75" font-size="13" font-weight="400" fill="#6c757d" text-anchor="end">+30</text>
<text x="110.0" y="422" font-size="13" font-weight="400" fill="#6c757d" text-anchor="middle">1</text>
<text x="296.66666666666663" y="422" font-size="13" font-weight="400" fill="#6c757d" text-anchor="middle">10</text>
<text x="483.3333333333333" y="422" font-size="13" font-weight="400" fill="#6c757d" text-anchor="middle">100</text>
<text x="670.0" y="422" font-size="13" font-weight="400" fill="#6c757d" text-anchor="middle">1000</text>
<rect x="110" y="100.0" width="560" height="112.5" fill="#ffc107" opacity="0.18"/>
<text x="660" y="156.25" font-size="13" font-weight="700" fill="#856404" text-anchor="end">Headroom zone</text>
