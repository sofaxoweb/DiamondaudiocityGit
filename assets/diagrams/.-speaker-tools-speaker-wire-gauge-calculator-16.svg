<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>Wire + Speaker as a Voltage Divider</title>
<desc>The amplifier's voltage splits across wire resistance and speaker impedance.</desc>
<rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
<text x="20" y="36" font-size="20" font-weight="700" fill="#212529">Wire + Speaker as a Voltage Divider</text>
<circle cx="90" cy="240" r="26" fill="#ffffff" stroke="#0d6efd" stroke-width="3"/>
<text x="90" y="246" font-size="13" font-weight="700" fill="#212529" text-anchor="middle">V amp</text>
<line x1="116" y1="240" x2="280" y2="240" stroke="#212529" stroke-width="2.5"/>
<rect x="280" y="214" width="150" height="52" rx="8" fill="#ffffff" stroke="#dc3545" stroke-width="2"/>
<text x="355" y="236" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">R wire</text>
<text x="355" y="256" font-size="12.5" font-weight="400" fill="#dc3545" text-anchor="middle">lost as heat</text>
<line x1="430" y1="240" x2="540" y2="240" stroke="#212529" stroke-width="2.5"/>
<rect x="540" y="214" width="150" height="52" rx="8" fill="#ffffff" stroke="#198754" stroke-width="2"/>
<text x="615" y="236" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">R speaker</text>
<text x="615" y="256" font-size="12.5" font-weight="400" fill="#198754" text-anchor="middle">makes sound</text>
<line x1="690" y1="240" x2="740" y2="240" stroke="#212529" stroke-width="2.5"/>
<line x1="740" y1="240" x2="740" y2="330" stroke="#212529" stroke-width="2.5"/>
<line x1="90" y1="240" x2="90" y2="330" stroke="#212529" stroke-width="2.5"/>
<line x1="90" y1="330" x2="740" y2="330" stroke="#212529" stroke-width="2.5"/>
<text x="415" y="200" font-size="13" font-weight="700" fill="#dc3545" text-anchor="middle">V wire</text>
<text x="615" y="200" font-size="13" font-weight="700" fill="#198754" text-anchor="middle">V spk</text>
<text x="400" y="70" font-size="17" font-weight="700" fill="#212529" text-anchor="middle">V amp  =  V wire  +  V speaker</text>
<rect x="130" y="360" width="540" height="62" rx="8" fill="#f0f6ff" stroke="#0d6efd" stroke-width="1.5"/>
<text x="400" y="386" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">Power lost in the wire =  R wire / (R wire + R speaker)</text>
<text x="400" y="408" font-size="13" font-weight="400" fill="#6c757d" text-anchor="middle">Example: 0.5 Ω wire + 8 Ω speaker means about 6% of the power wasted as heat</text>
</svg>