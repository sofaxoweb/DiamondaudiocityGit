<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Diagram: the EBP rule — which enclosure your driver&#x27;s Fs/Qes ratio points to">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#212529">EBP: which enclosure your driver wants</text>
<text x="400" y="70" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">EBP = Fs ÷ Qes</text>
<rect x="90.0" y="205" width="155.0" height="90" fill="#cfe2ff"/>
<rect x="245.0" y="205" width="155.0" height="90" fill="#fff3cd"/>
<rect x="400.0" y="205" width="310.0" height="90" fill="#d1e7dd"/>
<line x1="90.0" y1="250" x2="710.0" y2="250" stroke="#212529" stroke-width="3"/>
<line x1="90.0" y1="250" x2="90.0" y2="260" stroke="#212529" stroke-width="2"/>
<text x="90.0" y="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">0</text>
<line x1="245.0" y1="250" x2="245.0" y2="260" stroke="#212529" stroke-width="2"/>
<text x="245.0" y="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">50</text>
<line x1="400.0" y1="250" x2="400.0" y2="260" stroke="#212529" stroke-width="2"/>
<text x="400.0" y="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">100</text>
<line x1="555.0" y1="250" x2="555.0" y2="260" stroke="#212529" stroke-width="2"/>
<text x="555.0" y="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">150</text>
<line x1="710.0" y1="250" x2="710.0" y2="260" stroke="#212529" stroke-width="2"/>
<text x="710.0" y="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle">200</text>
<text x="167.5" y="305" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold">Sealed</text>
<text x="322.5" y="305" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold">Either</text>
<text x="555.0" y="305" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold">Ported</text>
<text x="245.0" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">≈ 50</text>
<text x="400.0" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">≈ 100</text>
<circle cx="232.6" cy="250" r="9" fill="#198754" stroke="#212529" stroke-width="2"/>
<line x1="232.6" y1="238" x2="232.6" y2="152" stroke="#198754" stroke-width="2" stroke-dasharray="5,4"/>
<text x="232.6" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">A: Fs 30 / Qes 0.65</text>
<text x="232.6" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#198754" text-anchor="middle" font-weight="bold">EBP = 46</text>
<circle cx="331.8" cy="250" r="9" fill="#ffc107" stroke="#212529" stroke-width="2"/>
<line x1="331.8" y1="238" x2="331.8" y2="187" stroke="#ffc107" stroke-width="2" stroke-dasharray="5,4"/>
<text x="331.8" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">B: Fs 35 / Qes 0.45</text>
<text x="331.8" y="155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffc107" text-anchor="middle" font-weight="bold">EBP = 78</text>
<circle cx="489.9" cy="250" r="9" fill="#0d6efd" stroke="#212529" stroke-width="2"/>
<line x1="489.9" y1="238" x2="489.9" y2="152" stroke="#0d6efd" stroke-width="2" stroke-dasharray="5,4"/>
<text x="489.9" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold">C: Fs 45 / Qes 0.35</text>
<text x="489.9" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0d6efd" text-anchor="middle" font-weight="bold">EBP = 129</text>
<text x="400" y="400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">Under ~50 → sealed box · 50–100 → either works · Over ~100 → ported box</text>
</svg>
