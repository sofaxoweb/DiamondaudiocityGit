<text x="650" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#dc3545" text-anchor="middle" font-weight="bold">4 ÷ 4 = 1 Ω</text>
<text x="650" y="324" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#dc3545" text-anchor="middle">competition only — amp killer</text>
