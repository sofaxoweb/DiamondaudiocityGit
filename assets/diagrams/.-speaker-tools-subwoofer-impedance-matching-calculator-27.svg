<text x="445" y="237" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6c757d" text-anchor="middle">DVC sub</text>
<line x1="321" y1="175" x2="389" y2="175" stroke="#212529" stroke-width="3"/>
