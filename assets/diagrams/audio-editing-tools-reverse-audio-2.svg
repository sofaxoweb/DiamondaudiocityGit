<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>Reverse Reverb, Step by Step</text><rect x="28" y="120" width="172" height="120" rx="10" fill="#eef4ff" stroke="#0d6efd" stroke-width="2"/><text x="114" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>1 · Dry vocal</text><text x="114" y="184" text-anchor="middle" font-size="13.5" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>Record the phrase</text><text x="114" y="206" text-anchor="middle" font-size="13.5" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>with no reverb</text><text x="214" y="190" text-anchor="middle" font-size="24" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>→</text><rect x="218" y="120" width="172" height="120" rx="10" fill="#eef4ff" stroke="#0d6efd" stroke-width="2"/><text x="304" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>2 · Print reverb</text><text x="304" y="184" text-anchor="middle" font-size="13.5" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>Add 100% wet reverb</text><text x="304" y="206" text-anchor="middle" font-size="13.5" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>and export to a file</text><text x="404" y="190" text-anchor="middle" font-size="24" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>→</text><rect x="408" y="120" width="172" height="120" rx="10" fill="#eef4ff" stroke="#0d6efd" stroke-width="2"/><text x="494" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>3 · Reverse it</text><text x="494" y="184" text-anchor="middle" font-size="13.5" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>Flip the printed file</text><text x="494" y="206" text-anchor="middle" font-size="13.5" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>end-to-start</text><text x="594" y="190" text-anchor="middle" font-size="24" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>→</text><rect x="598" y="120" width="172" height="120" rx="10" fill="#eef4ff" stroke="#0d6efd" stroke-width="2"/><text x="684" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>4 · Align the tail</text><text x="684" y="184" text-anchor="middle" font-size="13.5" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>Reversed tail swells in</text><text x="684" y="206" text-anchor="middle" font-size="13.5" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>and ends at the vocal entrance</text><text x="400" y="300" text-anchor="middle" font-size="15" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>The listener hears a ghostly swell that resolves exactly where the dry vocal starts —</text><text x="400" y="328" text-anchor="middle" font-size="15" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>the reverb seems to “predict” the line before it is sung.</text><text x="400" y="392" text-anchor="middle" font-size="14" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>Keep the reversed tail on its own track so its level can be mixed under the dry vocal</text></svg>