<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>How a Browser Audio Tool Works</title>
<desc>Audio pipeline that runs entirely in the browser; nothing is uploaded to a server.</desc>
<rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
<text x="20" y="36" font-size="20" font-weight="700" fill="#212529">How a Browser Audio Tool Works</text>
<rect x="20" y="120" width="150" height="80" rx="8" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
<text x="95" y="150" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Audio file</text>
<text x="95" y="172" font-size="14" font-weight="400" fill="#212529" text-anchor="middle">upload</text>
<rect x="20" y="220" width="150" height="80" rx="8" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
<text x="95" y="250" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Microphone</text>
<text x="95" y="272" font-size="14" font-weight="400" fill="#212529" text-anchor="middle">input</text>
<defs><marker id="ah0d6efd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0d6efd"/></marker></defs>
<line x1="170" y1="160" x2="205" y2="160" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#ah0d6efd)"/>
<defs><marker id="ah0d6efd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0d6efd"/></marker></defs>
<line x1="170" y1="260" x2="205" y2="210" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#ah0d6efd)"/>
<rect x="210" y="120" width="160" height="180" rx="8" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
<text x="290" y="190" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">Web Audio API</text>
<text x="290" y="212" font-size="14" font-weight="400" fill="#212529" text-anchor="middle">decodes the</text>
<text x="290" y="232" font-size="14" font-weight="400" fill="#212529" text-anchor="middle">audio</text>
<defs><marker id="ah0d6efd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0d6efd"/></marker></defs>
<line x1="370" y1="210" x2="405" y2="210" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#ah0d6efd)"/>
<rect x="410" y="120" width="160" height="180" rx="8" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
<text x="490" y="190" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">Processed</text>
<text x="490" y="212" font-size="14" font-weight="400" fill="#212529" text-anchor="middle">on-device,</text>
<text x="490" y="232" font-size="14" font-weight="400" fill="#212529" text-anchor="middle">in your browser</text>
<defs><marker id="ah0d6efd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0d6efd"/></marker></defs>
<line x1="570" y1="160" x2="605" y2="160" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#ah0d6efd)"/>
<defs><marker id="ah0d6efd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0d6efd"/></marker></defs>
<line x1="570" y1="260" x2="605" y2="210" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#ah0d6efd)"/>
<rect x="610" y="120" width="170" height="80" rx="8" fill="#ffffff" stroke="#198754" stroke-width="2"/>
<text x="695" y="150" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Result shown</text>
<text x="695" y="172" font-size="14" font-weight="400" fill="#212529" text-anchor="middle">on screen</text>
<rect x="610" y="220" width="170" height="80" rx="8" fill="#ffffff" stroke="#198754" stroke-width="2"/>
<text x="695" y="250" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Audio file</text>
<text x="695" y="272" font-size="14" font-weight="400" fill="#212529" text-anchor="middle">downloaded</text>
<rect x="250" y="318" width="280" height="62" rx="8" fill="#ffffff" stroke="#6c757d" stroke-width="1.5"/>
<text x="390" y="356" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">Cloud / server</text>
<line x1="255" y1="323" x2="525" y2="375" stroke="#dc3545" stroke-width="6" opacity="0.85"/>
<line x1="525" y1="323" x2="255" y2="375" stroke="#dc3545" stroke-width="6" opacity="0.85"/>
<text x="390" y="412" font-size="14" font-weight="400" fill="#6c757d" text-anchor="middle">Nothing is uploaded - your audio never leaves this device</text>
</svg>