<line x1="312" y1="166" x2="488" y2="166" stroke="#6c757d" stroke-width="2" marker-end="url(#ah6c757d)"/>
<rect x="20" y="202" width="290" height="52" rx="8" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
<text x="165" y="234" font-size="14" font-weight="400" fill="#212529" text-anchor="middle">Check how loud a room is</text>
