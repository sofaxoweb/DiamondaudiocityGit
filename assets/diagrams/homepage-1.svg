<defs><marker id="ah6c757d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6c757d"/></marker></defs>
<line x1="312" y1="228" x2="488" y2="228" stroke="#6c757d" stroke-width="2" marker-end="url(#ah6c757d)"/>
<rect x="20" y="264" width="290" height="52" rx="8" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
<text x="165" y="296" font-size="14" font-weight="400" fill="#212529" text-anchor="middle">Cut silence from a recording</text>
