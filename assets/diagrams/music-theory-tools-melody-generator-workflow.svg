<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>The 5-Step Melody Workflow</text>
<rect x="28" y="150" width="140" height="120" rx="12" fill="#0d6efd"/>
<circle cx="98" cy="182" r="17" fill="#ffffff"/>
<text x="98" y="189" text-anchor="middle" font-size="17" font-weight="700" fill="#0d6efd" font-family='system-ui, -apple-system, sans-serif'>1</text>
<text x="98" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family='system-ui, -apple-system, sans-serif'>Choose a</text>
<text x="98" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family='system-ui, -apple-system, sans-serif'>scale</text>
<text x="98" y="300" text-anchor="middle" font-size="11.5" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>key + scale type</text>
<text x="175" y="218" text-anchor="middle" font-size="20" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>&#8594;</text>
<rect x="180" y="150" width="140" height="120" rx="12" fill="#0d6efd"/>
<circle cx="250" cy="182" r="17" fill="#ffffff"/>
<text x="250" y="189" text-anchor="middle" font-size="17" font-weight="700" fill="#0d6efd" font-family='system-ui, -apple-system, sans-serif'>2</text>
<text x="250" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family='system-ui, -apple-system, sans-serif'>Set the</text>
<text x="250" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family='system-ui, -apple-system, sans-serif'>rhythm</text>
<text x="250" y="300" text-anchor="middle" font-size="11.5" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>tempo + grid</text>
<text x="327" y="218" text-anchor="middle" font-size="20" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>&#8594;</text>
<rect x="332" y="150" width="140" height="120" rx="12" fill="#0d6efd"/>
<circle cx="402" cy="182" r="17" fill="#ffffff"/>
<text x="402" y="189" text-anchor="middle" font-size="17" font-weight="700" fill="#0d6efd" font-family='system-ui, -apple-system, sans-serif'>3</text>
<text x="402" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family='system-ui, -apple-system, sans-serif'>Place the</text>
<text x="402" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family='system-ui, -apple-system, sans-serif'>pitches</text>
<text x="402" y="300" text-anchor="middle" font-size="11.5" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>click notes on rows</text>
<text x="479" y="218" text-anchor="middle" font-size="20" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>&#8594;</text>
<rect x="484" y="150" width="140" height="120" rx="12" fill="#0d6efd"/>
<circle cx="554" cy="182" r="17" fill="#ffffff"/>
<text x="554" y="189" text-anchor="middle" font-size="17" font-weight="700" fill="#0d6efd" font-family='system-ui, -apple-system, sans-serif'>4</text>
<text x="554" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family='system-ui, -apple-system, sans-serif'>Loop &amp;</text>
<text x="554" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family='system-ui, -apple-system, sans-serif'>refine</text>
<text x="554" y="300" text-anchor="middle" font-size="11.5" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>listen, adjust, thin out</text>
<text x="631" y="218" text-anchor="middle" font-size="20" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>&#8594;</text>
<rect x="636" y="150" width="140" height="120" rx="12" fill="#198754"/>
<circle cx="706" cy="182" r="17" fill="#ffffff"/>
<text x="706" y="189" text-anchor="middle" font-size="17" font-weight="700" fill="#198754" font-family='system-ui, -apple-system, sans-serif'>5</text>
<text x="706" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family='system-ui, -apple-system, sans-serif'>Finish in</text>
<text x="706" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family='system-ui, -apple-system, sans-serif'>your DAW</text>
<text x="706" y="300" text-anchor="middle" font-size="11.5" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>recreate the hook</text>
<text x="400" y="360" text-anchor="middle" font-size="13" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>The generator has no save or export — the loop you hear is the draft; your DAW is where it becomes a track</text>
</svg>