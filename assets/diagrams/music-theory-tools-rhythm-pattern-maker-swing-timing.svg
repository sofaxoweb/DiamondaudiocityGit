<text x="530" y="306" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dc3545" font-family='system-ui, -apple-system, sans-serif'>+41.7 ms late</text>
<rect x="120" y="382" width="560" height="42" rx="8" fill="#cfe2ff"/>
<text x="400" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>Machine scales differ: an MPC "58%" pocket is only ~16% on this slider</text>
