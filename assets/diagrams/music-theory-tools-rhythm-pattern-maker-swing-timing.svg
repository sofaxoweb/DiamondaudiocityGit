<text x="506" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#198754" font-family='system-ui, -apple-system, sans-serif'>+31.25 ms late</text>
<text x="142" y="262" text-anchor="end" font-size="13.5" font-weight="700" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>Triplet shuffle — ~33% here</text>
<line x1="150" y1="276" x2="720" y2="276" stroke="#adb5bd" stroke-width="2"/>
<rect x="145" y="265" width="10" height="22" fill="#212529"/>
