<text x="720" y="352" text-anchor="middle" font-size="12" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>250 ms</text>
<text x="142" y="106" text-anchor="end" font-size="13.5" font-weight="700" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>Straight 16ths — 0%</text>
<line x1="150" y1="120" x2="720" y2="120" stroke="#adb5bd" stroke-width="2"/>
<rect x="145" y="109" width="10" height="22" fill="#212529"/>
<rect x="430" y="109" width="10" height="22" fill="#0d6efd"/>
<text x="435" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d6efd" font-family='system-ui, -apple-system, sans-serif'>+0 ms (on the grid)</text>
<text x="142" y="184" text-anchor="end" font-size="13.5" font-weight="700" fill="#212529" font-family='system-ui, -apple-system, sans-serif'>This tool — 25% swing</text>
<line x1="150" y1="198" x2="720" y2="198" stroke="#adb5bd" stroke-width="2"/>
<rect x="145" y="187" width="10" height="22" fill="#212529"/>
