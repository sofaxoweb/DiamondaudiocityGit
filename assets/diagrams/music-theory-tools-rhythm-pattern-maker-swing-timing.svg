<text x="292" y="352" text-anchor="middle" font-size="12" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>62.5 ms</text>
<line x1="435" y1="86" x2="435" y2="330" stroke="#dee2e6" stroke-width="1"/>
<text x="435" y="352" text-anchor="middle" font-size="12" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>125 ms</text>
<line x1="578" y1="86" x2="578" y2="330" stroke="#dee2e6" stroke-width="1"/>
<text x="578" y="352" text-anchor="middle" font-size="12" fill="#6c757d" font-family='system-ui, -apple-system, sans-serif'>187.5 ms</text>
