<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Cuerdas al aire de la guitarra con tono de concierto">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">Cuerdas al aire de la guitarra con tono de concierto (A4 = 440 Hz)</text>
<text x="24" y="58" font-size="14" fill="#6c757d">Afinación estándar, de grave a agudo. La longitud de las barras es logarítmica — cada octava tiene el mismo ancho.</text>

<g font-size="15" fill="#212529">
<text x="24" y="128" font-weight="bold">6 · E2</text>
<text x="24" y="172" font-weight="bold">5 · A2</text>
<text x="24" y="216" font-weight="bold">4 · D3</text>
<text x="24" y="260" font-weight="bold">3 · G3</text>
<text x="24" y="304" font-weight="bold">2 · B3</text>
<text x="24" y="348" font-weight="bold">1 · E4</text>
</g>
<!-- bars: x = 140 + log2(f/82.41)*280, width proportional -->
<g>
<rect x="140" y="112" width="6" height="24" fill="#0d6efd"/><text x="160" y="131" font-size="14" fill="#212529">82.41 Hz · <tspan fill="#6c757d">−2900¢ vs A4</tspan></text>
<rect x="140" y="156" width="116.5" height="24" fill="#0d6efd"/><text x="270" y="175" font-size="14" fill="#212529">110.00 Hz · <tspan fill="#6c757d">−2400¢</tspan></text>
<rect x="140" y="200" width="233.3" height="24" fill="#0d6efd"/><text x="388" y="219" font-size="14" fill="#212529">146.83 Hz · <tspan fill="#6c757d">−1900¢</tspan></text>
<rect x="140" y="244" width="350" height="24" fill="#0d6efd"/><text x="504" y="263" font-size="14" fill="#212529">196.00 Hz · <tspan fill="#6c757d">−1400¢</tspan></text>
<rect x="140" y="288" width="443.3" height="24" fill="#0d6efd"/><text x="598" y="307" font-size="14" fill="#212529">246.94 Hz · <tspan fill="#6c757d">−1000¢</tspan></text>
<rect x="140" y="332" width="560" height="24" fill="#198754"/><text x="714" y="351" font-size="14" fill="#212529">329.63 Hz · <tspan fill="#6c757d">−500¢</tspan></text>
</g>
<rect x="24" y="380" width="752" height="50" rx="8" fill="#eef4ff"/>
<text x="40" y="410" font-size="14" fill="#212529">Cents respecto a A4 = 440 Hz: la 1.ª cuerda (E4) está <tspan font-weight="bold">5 semitonos (−500¢)</tspan> por debajo del tono de concierto; la 6.ª cuerda (E2) está <tspan font-weight="bold">29 semitonos (−2900¢)</tspan> por debajo de él.</text>
</svg>
