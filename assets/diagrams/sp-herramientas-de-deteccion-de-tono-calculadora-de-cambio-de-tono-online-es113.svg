<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Relación de frecuencia frente a cambio de semitonos">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">Relación de frecuencia frente a cambio de semitonos</text>

<!-- plot area -->
<line x1="60" y1="380" x2="740" y2="380" stroke="#212529" stroke-width="2"/>
<line x1="60" y1="380" x2="60" y2="80" stroke="#212529" stroke-width="2"/>
<text x="400" y="428" font-size="14" fill="#212529" text-anchor="middle">Cambio de semitonos (n)</text>
<text x="28" y="230" font-size="14" fill="#212529" text-anchor="middle" transform="rotate(-90 28 230)">Relación de frecuencia</text>

<!-- y gridlines -->
<g font-size="13" fill="#6c757d" text-anchor="end">
<line x1="60" y1="356" x2="740" y2="356" stroke="#dee2e6" stroke-width="1"/><text x="52" y="360">0.5</text>
<line x1="60" y1="260" x2="740" y2="260" stroke="#dee2e6" stroke-width="1"/><text x="52" y="264">1.0</text>
<line x1="60" y1="164" x2="740" y2="164" stroke="#dee2e6" stroke-width="1"/><text x="52" y="168">1.5</text>
<line x1="60" y1="68" x2="740" y2="68" stroke="#dee2e6" stroke-width="1"/><text x="52" y="72">2.0</text>
</g>
<!-- x ticks -->
<g font-size="13" fill="#212529" text-anchor="middle">
<text x="60" y="398">−12</text><text x="145" y="398">−9</text><text x="230" y="398">−6</text><text x="315" y="398">−3</text><text x="400" y="398">0</text><text x="485" y="398">+3</text><text x="570" y="398">+6</text><text x="655" y="398">+9</text><text x="740" y="398">+12</text>
</g>
<!-- unison reference -->
<line x1="60" y1="260" x2="740" y2="260" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="730" y="252" font-size="13" fill="#6c757d" text-anchor="end">unísono (1.0)</text>

<!-- exponential curve -->
<polyline points="60.0,320.0 88.3,316.4 116.7,312.7 145.0,308.6 173.3,304.4 201.7,299.9 230.0,295.1 258.3,290.1 286.7,284.8 315.0,279.1 343.3,273.1 371.7,266.7 400.0,260.0 428.3,252.9 456.7,245.3 485.0,237.3 513.3,228.8 541.7,219.8 570.0,210.3 598.3,200.2 626.7,189.5 655.0,178.2 683.3,166.2 711.7,153.5 740.0,140.0" fill="none" stroke="#0d6efd" stroke-width="3.5"/>

<!-- marked points -->
<circle cx="60" cy="320" r="7" fill="#dc3545" stroke="#ffffff" stroke-width="2"/>
<text x="70" y="345" font-size="13" fill="#dc3545" font-weight="bold">−12 → ×0.5</text>
<circle cx="598.3" cy="200.2" r="7" fill="#198754" stroke="#ffffff" stroke-width="2"/>
<text x="608" y="190" font-size="13" fill="#198754" font-weight="bold">+7 → ×1.49831 (quinta justa)</text>
<circle cx="740" cy="140" r="7" fill="#0d6efd" stroke="#ffffff" stroke-width="2"/>
<text x="700" y="118" font-size="13" fill="#0d6efd" font-weight="bold">+12 → ×2.0 (octava)</text>

<rect x="24" y="60" width="420" height="34" rx="8" fill="#eef4ff"/>
<text x="40" y="83" font-size="14" fill="#212529"><tspan font-weight="bold">Fórmula:</tspan> relación = 2^(n/12) — la curva es exponencial, no una línea recta.</text>
</svg>
