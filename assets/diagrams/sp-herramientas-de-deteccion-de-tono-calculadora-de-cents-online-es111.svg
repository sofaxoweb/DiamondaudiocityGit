<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Comparación de escala lineal de hercios y escala logarítmica de cents">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">Hercios lineales vs cents logarítmicos (A1–A6)</text>
<text x="24" y="58" font-size="14" fill="#6c757d">Arriba: espaciado igual por hercio — las octavas se amontonan en tonos altos. Abajo: espaciado igual por cent — cada octava tiene el mismo ancho.</text>

<!-- LINEAR axis -->
<text x="24" y="140" font-size="15" font-weight="bold" fill="#212529">Escala lineal de Hz</text>
<line x1="80" y1="170" x2="720" y2="170" stroke="#212529" stroke-width="2"/>
<!-- octave ticks on linear axis: x = 80 + (f-55)/1705*640 -->
<g font-size="13" fill="#212529" text-anchor="middle">
<line x1="80" y1="170" x2="80" y2="180" stroke="#212529" stroke-width="2"/><text x="80" y="200">A1 · 55</text>
<line x1="100.6" y1="170" x2="100.6" y2="180" stroke="#212529" stroke-width="2"/><text x="100.6" y="200">A2 · 110</text>
<line x1="141.9" y1="170" x2="141.9" y2="180" stroke="#212529" stroke-width="2"/><text x="141.9" y="200">A3 · 220</text>
<line x1="224.5" y1="170" x2="224.5" y2="180" stroke="#212529" stroke-width="2"/><text x="224.5" y="200">A4 · 440</text>
<line x1="389.7" y1="170" x2="389.7" y2="180" stroke="#212529" stroke-width="2"/><text x="389.7" y="200">A5 · 880</text>
<line x1="720" y1="170" x2="720" y2="180" stroke="#212529" stroke-width="2"/><text x="720" y="200">A6 · 1760</text>
</g>
<!-- annotation brackets -->
<line x1="80" y1="130" x2="100.6" y2="130" stroke="#dc3545" stroke-width="2"/>
<text x="90" y="122" font-size="13" fill="#dc3545" text-anchor="middle">1200¢ = 55 Hz</text>
<line x1="389.7" y1="130" x2="720" y2="130" stroke="#dc3545" stroke-width="2"/>
<text x="555" y="122" font-size="13" fill="#dc3545" text-anchor="middle">1200¢ = 880 Hz</text>

<!-- LOG axis -->
<text x="24" y="270" font-size="15" font-weight="bold" fill="#212529">Escala logarítmica de cents</text>
<line x1="80" y1="300" x2="720" y2="300" stroke="#212529" stroke-width="2"/>
<g font-size="13" fill="#212529" text-anchor="middle">
<line x1="80" y1="300" x2="80" y2="310" stroke="#212529" stroke-width="2"/><text x="80" y="330">A1 · 0¢</text>
<line x1="208" y1="300" x2="208" y2="310" stroke="#212529" stroke-width="2"/><text x="208" y="330">A2 · 1200¢</text>
<line x1="336" y1="300" x2="336" y2="310" stroke="#212529" stroke-width="2"/><text x="336" y="330">A3 · 2400¢</text>
<line x1="464" y1="300" x2="464" y2="310" stroke="#212529" stroke-width="2"/><text x="464" y="330">A4 · 3600¢</text>
<line x1="592" y1="300" x2="592" y2="310" stroke="#212529" stroke-width="2"/><text x="592" y="330">A5 · 4800¢</text>
<line x1="720" y1="300" x2="720" y2="310" stroke="#212529" stroke-width="2"/><text x="720" y="330">A6 · 6000¢</text>
</g>

<rect x="24" y="368" width="752" height="58" rx="8" fill="#eef4ff"/>
<text x="40" y="392" font-size="14" fill="#212529"><tspan font-weight="bold">Fórmula:</tspan> cents = 1200 × log₂(f₂ / f₁) — una octava (×2 de frecuencia) son siempre 1200 cents.</text>
<text x="40" y="414" font-size="14" fill="#212529">Los pasos iguales en cents <tspan fill="#dc3545" font-weight="bold">se comprimen en Hz</tspan> en tonos graves y <tspan fill="#dc3545" font-weight="bold">se estiran en Hz</tspan> en tonos agudos.</text>
</svg>
