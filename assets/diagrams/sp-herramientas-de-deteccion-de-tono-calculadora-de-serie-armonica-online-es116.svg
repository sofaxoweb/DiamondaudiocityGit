<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Registros de órgano asignados a la serie armónica">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">Registros de órgano asignados a la serie armónica</text>
<text x="24" y="58" font-size="14" fill="#6c757d">Tubo más corto = armónico más alto. Un tubo de 8′ suena el tono escrito; cada registro suena un armónico de este.</text>

<!-- pipes, baseline y=380, heights proportional to 1/f -->
<line x1="40" y1="380" x2="300" y2="380" stroke="#212529" stroke-width="2"/>
<g text-anchor="middle">
<rect x="50" y="90" width="40" height="290" fill="#e8eefc" stroke="#212529" stroke-width="2"/><text x="70" y="400" font-size="14" font-weight="bold" fill="#212529">8′</text>
<rect x="110" y="235" width="40" height="145" fill="#dbe7fa" stroke="#212529" stroke-width="2"/><text x="130" y="400" font-size="14" font-weight="bold" fill="#212529">4′</text>
<rect x="170" y="283" width="40" height="97" fill="#d3e0f8" stroke="#212529" stroke-width="2"/><text x="190" y="400" font-size="14" font-weight="bold" fill="#212529">2⅔′</text>
<rect x="230" y="308" width="40" height="72" fill="#cbd9f6" stroke="#212529" stroke-width="2"/><text x="250" y="400" font-size="14" font-weight="bold" fill="#212529">2′</text>
<rect x="285" y="322" width="40" height="58" fill="#c3d2f4" stroke="#212529" stroke-width="2"/><text x="305" y="400" font-size="14" font-weight="bold" fill="#212529">1⅗′</text>
</g>

<!-- table -->
<g font-size="14" fill="#212529">
<rect x="360" y="80" width="416" height="320" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
<text x="380" y="110" font-size="14" font-weight="bold" fill="#6c757d">REGISTRO</text>
<text x="470" y="110" font-size="14" font-weight="bold" fill="#6c757d">ARMÓNICO</text>
<text x="590" y="110" font-size="14" font-weight="bold" fill="#6c757d">INTERVALO</text>
<text x="700" y="110" font-size="14" font-weight="bold" fill="#6c757d">×f</text>
<line x1="370" y1="122" x2="766" y2="122" stroke="#dee2e6" stroke-width="1.5"/>

<text x="380" y="158" font-weight="bold">8′</text><text x="470" y="158">1.er armónico</text><text x="590" y="158">unísono</text><text x="700" y="158" font-weight="bold" fill="#0d6efd">×1</text>
<text x="380" y="212" font-weight="bold">4′</text><text x="470" y="212">2.º armónico</text><text x="590" y="212">octava</text><text x="700" y="212" font-weight="bold" fill="#0d6efd">×2</text>
<text x="380" y="266" font-weight="bold">2⅔′</text><text x="470" y="266">3.er armónico</text><text x="590" y="266">duodécima (8va + 5.ª)</text><text x="700" y="266" font-weight="bold" fill="#0d6efd">×3</text>
<text x="380" y="320" font-weight="bold">2′</text><text x="470" y="320">4.º armónico</text><text x="590" y="320">decimoquinta (2 octavas)</text><text x="700" y="320" font-weight="bold" fill="#0d6efd">×4</text>
<text x="380" y="374" font-weight="bold">1⅗′</text><text x="470" y="374">5.º armónico</text><text x="590" y="374">tercia (2 octavas + 3.ª)</text><text x="700" y="374" font-weight="bold" fill="#0d6efd">×5</text>
<line x1="370" y1="176" x2="766" y2="176" stroke="#dee2e6" stroke-width="1"/>
<line x1="370" y1="230" x2="766" y2="230" stroke="#dee2e6" stroke-width="1"/>
<line x1="370" y1="284" x2="766" y2="284" stroke="#dee2e6" stroke-width="1"/>
<line x1="370" y1="338" x2="766" y2="338" stroke="#dee2e6" stroke-width="1"/>
</g>
<text x="24" y="432" font-size="13" fill="#6c757d">Los registros de mutación (2⅔′, 1⅗′) aportan color al sonar armónicos no octavados de la fundamental de 8′.</text>
</svg>
