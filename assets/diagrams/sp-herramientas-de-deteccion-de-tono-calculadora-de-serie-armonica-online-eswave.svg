<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">Decaimiento de amplitud armónica: diente de sierra, cuadrada, triangular</text>
<text x="24" y="58" font-size="13" fill="#6c757d">Amplitud relativa del armónico n (fundamental = 1.0)</text>
<!-- axes -->
<line x1="70" y1="380" x2="770" y2="380" stroke="#212529" stroke-width="1.5"/>
<line x1="70" y1="380" x2="70" y2="90" stroke="#212529" stroke-width="1.5"/>
<text x="30" y="240" font-size="13" fill="#6c757d" transform="rotate(-90 30 240)" text-anchor="middle">Amplitud</text>
<text x="420" y="415" font-size="13" fill="#6c757d" text-anchor="middle">Número de armónico (n)</text>
<!-- y ticks -->
<text x="62" y="384" font-size="12" fill="#6c757d" text-anchor="end">0</text>
<text x="62" y="309" font-size="12" fill="#6c757d" text-anchor="end">0.25</text>
<text x="62" y="234" font-size="12" fill="#6c757d" text-anchor="end">0.5</text>
<text x="62" y="159" font-size="12" fill="#6c757d" text-anchor="end">0.75</text>
<text x="62" y="94" font-size="12" fill="#6c757d" text-anchor="end">1.0</text>
<!-- bars: harmonics 1..8, y = 380 - amp*290 -->
<!-- sawtooth 1/n all harmonics, color #0d6efd, x offset -14 -->
<!-- square odd 1/n, color #198754, x offset 0 -->
<!-- triangle odd 1/n^2, color #ffc107, x offset +14 -->
<g>
<!-- n=1: all = 1.0, y=90 -->
<rect x="96" y="90" width="12" height="290" fill="#0d6efd"/>
<rect x="110" y="90" width="12" height="290" fill="#198754"/>
<rect x="124" y="90" width="12" height="290" fill="#ffc107"/>
<text x="116" y="398" font-size="12" fill="#6c757d" text-anchor="middle">1</text>
<!-- n=2: saw 0.5 -> y=235; square/triangle 0 -->
<rect x="176" y="235" width="12" height="145" fill="#0d6efd"/>
<text x="196" y="398" font-size="12" fill="#6c757d" text-anchor="middle">2</text>
<!-- n=3: saw 0.333 -> y=283.3; square 0.333 -> y=283.3; triangle 0.111 -> y=347.8 -->
<rect x="256" y="283" width="12" height="97" fill="#0d6efd"/>
<rect x="270" y="283" width="12" height="97" fill="#198754"/>
<rect x="284" y="348" width="12" height="32" fill="#ffc107"/>
<text x="276" y="398" font-size="12" fill="#6c757d" text-anchor="middle">3</text>
<!-- n=4: saw 0.25 -> y=307.5 -->
<rect x="336" y="308" width="12" height="72" fill="#0d6efd"/>
<text x="356" y="398" font-size="12" fill="#6c757d" text-anchor="middle">4</text>
<!-- n=5: saw 0.2 -> y=322; square 0.2 -> y=322; triangle 0.04 -> y=368.4 -->
<rect x="416" y="322" width="12" height="58" fill="#0d6efd"/>
<rect x="430" y="322" width="12" height="58" fill="#198754"/>
<rect x="444" y="368" width="12" height="12" fill="#ffc107"/>
<text x="436" y="398" font-size="12" fill="#6c757d" text-anchor="middle">5</text>
<!-- n=6: saw 0.1667 -> y=331.7 -->
<rect x="496" y="332" width="12" height="48" fill="#0d6efd"/>
<text x="516" y="398" font-size="12" fill="#6c757d" text-anchor="middle">6</text>
<!-- n=7: saw 0.1429 -> y=338.6; square 0.1429 -> y=338.6; triangle 0.0204 -> y=374.1 -->
<rect x="576" y="339" width="12" height="41" fill="#0d6efd"/>
<rect x="590" y="339" width="12" height="41" fill="#198754"/>
<rect x="604" y="374" width="12" height="6" fill="#ffc107"/>
<text x="596" y="398" font-size="12" fill="#6c757d" text-anchor="middle">7</text>
<!-- n=8: saw 0.125 -> y=343.75 -->
<rect x="656" y="344" width="12" height="36" fill="#0d6efd"/>
<text x="676" y="398" font-size="12" fill="#6c757d" text-anchor="middle">8</text>
</g>
<!-- legend -->
<rect x="560" y="100" width="14" height="14" fill="#0d6efd"/>
<text x="580" y="112" font-size="13" fill="#212529">Diente de sierra: todos, 1/n</text>
<rect x="560" y="124" width="14" height="14" fill="#198754"/>
<text x="580" y="136" font-size="13" fill="#212529">Cuadrada: impares, 1/n</text>
<rect x="560" y="148" width="14" height="14" fill="#ffc107"/>
<text x="580" y="160" font-size="13" fill="#212529">Triangular: impares, 1/n²</text>
<text x="560" y="184" font-size="12" fill="#6c757d">La triangular decae más rápido:</text>
<text x="560" y="200" font-size="12" fill="#6c757d">suena más suave y redonda.</text>
</svg>
