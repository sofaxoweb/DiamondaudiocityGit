<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Diagrama de pentagrama que muestra cómo las mismas cuatro notas se llaman Am7 o C6 según la nota del bajo" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="20" y="38" font-size="20" font-weight="bold" fill="#212529">Mismas notas, dos nombres: el bajo decide</text><line x1="150" y1="130" x2="650" y2="130" stroke="#212529" stroke-width="1.5"/><line x1="150" y1="142" x2="650" y2="142" stroke="#212529" stroke-width="1.5"/><line x1="150" y1="154" x2="650" y2="154" stroke="#212529" stroke-width="1.5"/><line x1="150" y1="166" x2="650" y2="166" stroke="#212529" stroke-width="1.5"/><line x1="150" y1="178" x2="650" y2="178" stroke="#212529" stroke-width="1.5"/><line x1="198" y1="190" x2="242" y2="190" stroke="#212529" stroke-width="1.5"/><ellipse cx="220" cy="190" rx="13" ry="9" fill="none" stroke="#212529" stroke-width="3" transform="rotate(-18 220 190)"/><text x="220" y="224" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">C</text><ellipse cx="340" cy="178" rx="13" ry="9" fill="none" stroke="#212529" stroke-width="3" transform="rotate(-18 340 178)"/><text x="340" y="212" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">E</text><ellipse cx="460" cy="166" rx="13" ry="9" fill="none" stroke="#212529" stroke-width="3" transform="rotate(-18 460 166)"/><text x="460" y="200" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">G</text><ellipse cx="580" cy="160" rx="13" ry="9" fill="none" stroke="#212529" stroke-width="3" transform="rotate(-18 580 160)"/><text x="580" y="194" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">A</text><text x="150" y="112" font-size="13" fill="#6c757d" text-anchor="start">clave de sol</text><rect x="60" y="270" width="330" height="120" rx="8" fill="#d1e7dd" stroke="#198754" stroke-width="2"/><text x="225" y="300" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">Nota del bajo = A  →  Am7</text><text x="225" y="328" font-size="14" fill="#212529" text-anchor="middle">A – C – E – G</text><text x="225" y="352" font-size="13" fill="#6c757d" text-anchor="middle">root · ♭3 · 5 · ♭7</text><rect x="410" y="270" width="330" height="120" rx="8" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2"/><text x="575" y="300" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">Nota del bajo = C  →  C6</text><text x="575" y="328" font-size="14" fill="#212529" text-anchor="middle">C – E – G – A</text><text x="575" y="352" font-size="13" fill="#6c757d" text-anchor="middle">root · 3 · 5 · 6</text><text x="400" y="420" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">Las mismas cuatro clases de tono — la nota más grave nombra el acorde.</text></svg>